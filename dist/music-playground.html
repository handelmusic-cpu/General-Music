/* ==========================================================================
   Music Playground — bright, playful, touch-first styling
   Designed for iPad & Chromebook browsers. Big tap targets, no hover reliance.
   ========================================================================== */

:root {
  --pink:   #ff5da2;
  --coral:  #ff7a59;
  --orange: #ffab3d;
  --yellow: #ffd23f;
  --lime:   #7ed957;
  --teal:   #2dd4bf;
  --sky:    #38bdf8;
  --blue:   #5b8cff;
  --purple: #a06bff;
  --grape:  #c86bff;

  --ink:    #2b2140;
  --ink-soft:#5a4f73;
  --paper:  #fff;
  --cream:  #fff7ee;

  --shadow: 0 10px 0 rgba(43, 33, 64, 0.12), 0 14px 30px rgba(43, 33, 64, 0.18);
  --shadow-sm: 0 6px 0 rgba(43, 33, 64, 0.10), 0 8px 18px rgba(43, 33, 64, 0.14);
  --radius: 26px;
  --radius-sm: 16px;

  --font-round: 'Baloo 2', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -5%, #ffe6f2 0%, transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, #e6f3ff 0%, transparent 50%),
    radial-gradient(900px 700px at 50% 120%, #eafbe7 0%, transparent 55%),
    var(--cream);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  overscroll-behavior: none;
}

/* ------------------------------- Header ---------------------------------- */
.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px clamp(12px, 3vw, 28px);
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 247, 238, 0.82);
  backdrop-filter: blur(10px);
  border-bottom: 3px solid rgba(43, 33, 64, 0.06);
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: none;
  background: transparent;
  font-family: var(--font-round);
  font-weight: 800;
  font-size: clamp(18px, 2.6vw, 26px);
  color: var(--ink);
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 14px;
}
.home-btn:active { transform: scale(0.96); }
.home-btn__icon { font-size: 1.5em; }
.header-spacer { flex: 1; }

.ghost-btn {
  border: none;
  background: #fff;
  box-shadow: var(--shadow-sm);
  border-radius: 14px;
  width: 48px;
  height: 48px;
  font-size: 22px;
  cursor: pointer;
  color: var(--ink);
}
.ghost-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(43,33,64,.1); }

/* ------------------------------- Layout ---------------------------------- */
.view {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: clamp(14px, 3vw, 34px);
  padding-bottom: 60px;
}

.app-footer {
  text-align: center;
  color: var(--ink-soft);
  font-size: 13px;
  padding: 10px 16px 18px;
  opacity: 0.8;
}
.app-footer__sep { margin: 0 6px; }
.app-footer a { color: inherit; font-weight: 700; text-decoration: underline; }

/* ------------------------------- Home ------------------------------------ */
.hero {
  text-align: center;
  margin: 6px 0 22px;
}
.hero h1 {
  font-family: var(--font-round);
  font-weight: 800;
  font-size: clamp(30px, 6vw, 54px);
  line-height: 1.02;
  margin: 6px 0 6px;
  color: var(--ink);
}
.hero h1 .wave {
  background: linear-gradient(90deg, var(--pink), var(--orange), var(--lime), var(--sky), var(--purple));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p {
  font-size: clamp(15px, 2.4vw, 20px);
  color: var(--ink-soft);
  margin: 0 auto;
  max-width: 620px;
}

.tile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: clamp(14px, 2.4vw, 22px);
  margin-top: 20px;
}

.tile {
  position: relative;
  border: none;
  border-radius: var(--radius);
  padding: 22px 20px 24px;
  min-height: 178px;
  text-align: left;
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow);
  transition: transform .12s ease;
  overflow: hidden;
  font-family: var(--font-round);
}
.tile:active { transform: translateY(5px) scale(0.99); }
.tile__emoji { font-size: 48px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
.tile__title { font-size: 24px; font-weight: 800; margin-top: 10px; }
.tile__desc { font-size: 14.5px; font-weight: 600; opacity: 0.95; font-family: var(--font-body); }
.tile::after {
  content: "";
  position: absolute;
  right: -30px; top: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
}

.tile--pink   { background: linear-gradient(150deg, #ff8fc0, var(--pink)); }
.tile--orange { background: linear-gradient(150deg, #ffc06b, var(--coral)); }
.tile--lime   { background: linear-gradient(150deg, #a7f07a, var(--lime)); }
.tile--sky    { background: linear-gradient(150deg, #7fd8ff, var(--sky)); }
.tile--purple { background: linear-gradient(150deg, #c79bff, var(--purple)); }
.tile--teal   { background: linear-gradient(150deg, #6ff0dd, var(--teal)); }
.tile--yellow { background: linear-gradient(150deg, #ffe27a, #ffab3d); }
.tile--indigo { background: linear-gradient(150deg, #8aa0ff, var(--blue)); }
.tile--coral  { background: linear-gradient(150deg, #ff9e7a, var(--coral)); }
.tile--grape  { background: linear-gradient(150deg, #e0a3ff, var(--grape)); }
.tile--mint   { background: linear-gradient(150deg, #8ff0c0, #24c39a); }
.tile--gold   { background: linear-gradient(150deg, #ffe08a, #cf9a2e); }
.tile--rainbow{ background: linear-gradient(120deg, #ff5da2, #ffab3d, #7ed957, #38bdf8, #a06bff); }
.tile--berry  { background: linear-gradient(150deg, #ff7a9c, #e8368f); }
.tile--aqua   { background: linear-gradient(150deg, #5ee0ff, #2b9fd6); }

/* ---------------------------- Activity pages ----------------------------- */
.page-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.page-head h2 {
  font-family: var(--font-round);
  font-size: clamp(24px, 4vw, 38px);
  margin: 0;
}
.page-head p { margin: 2px 0 0; color: var(--ink-soft); font-weight: 600; }
.page-head .emoji { font-size: 40px; }

.back-btn {
  border: none;
  background: #fff;
  box-shadow: var(--shadow-sm);
  border-radius: 999px;
  padding: 12px 20px;
  font-family: var(--font-round);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  cursor: pointer;
}
.back-btn:active { transform: translateY(3px); }

.card {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: clamp(16px, 3vw, 26px);
  margin-bottom: 20px;
}

/* Generic playful controls */
.btn {
  border: none;
  border-radius: 999px;
  padding: 14px 24px;
  font-family: var(--font-round);
  font-weight: 800;
  font-size: 18px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(43,33,64,.18);
  transition: transform .08s ease, box-shadow .08s ease;
  min-height: 54px;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(43,33,64,.18); }
.btn--play  { background: linear-gradient(150deg, #8be86a, var(--lime)); }
.btn--stop  { background: linear-gradient(150deg, #ff8a8a, #ff5d5d); }
.btn--blue  { background: linear-gradient(150deg, #7fb0ff, var(--blue)); }
.btn--pink  { background: linear-gradient(150deg, #ff8fc0, var(--pink)); }
.btn--purple{ background: linear-gradient(150deg, #c79bff, var(--purple)); }
.btn--ghost { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }

.control-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}

.pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  border: 3px solid rgba(43,33,64,.10);
  background: #fff;
  border-radius: 999px;
  padding: 9px 16px;
  font-family: var(--font-round);
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  cursor: pointer;
}
.pill.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }

label.slider {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-round);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 14px;
  width: min(260px, 52vw);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--sky), var(--pink));
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #fff;
  border: 4px solid var(--pink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #fff;
  border: 4px solid var(--pink);
  cursor: pointer;
}

/* ---------------------------- Beat Boxes --------------------------------- */
.beat-row {
  display: flex;
  gap: clamp(8px, 1.6vw, 16px);
  justify-content: center;
  flex-wrap: wrap;
  margin: 8px 0 6px;
}
.beat-box {
  position: relative;
  flex: 1 1 0;
  min-width: 92px;
  max-width: 180px;
  aspect-ratio: 1 / 1;
  border-radius: 22px;
  border: 5px solid rgba(43,33,64,.12);
  background: #fff;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  user-select: none;
  transition: transform .06s ease, border-color .1s ease;
}
.beat-box:active { transform: scale(0.96); }
.beat-box.flash { animation: boxflash .28s ease; }
@keyframes boxflash {
  0% { transform: scale(1); background: #fff; }
  40% { transform: scale(1.08); background: var(--yellow); border-color: var(--orange); }
  100% { transform: scale(1); background: #fff; }
}
.beat-box .fruits { font-size: clamp(26px, 6vw, 52px); line-height: 1; letter-spacing: -2px; }
.beat-box .syllable {
  font-family: var(--font-round);
  font-weight: 800;
  color: var(--ink-soft);
  font-size: clamp(13px, 2.4vw, 18px);
}
.beat-box .count {
  position: absolute;
  top: 6px; left: 10px;
  font-family: var(--font-round);
  font-weight: 800;
  color: rgba(43,33,64,.25);
  font-size: 16px;
}
.legend {
  display: flex; flex-wrap: wrap; gap: 10px 18px;
  margin-top: 14px; color: var(--ink-soft); font-weight: 600; font-size: 14px;
}
.legend span b { color: var(--ink); }

/* ------------------------------ Staff ------------------------------------ */
.staff-wrap { overflow-x: auto; padding: 6px 0; }
.staff-svg { display: block; margin: 0 auto; max-width: 100%; height: auto; touch-action: manipulation; }
.note-readout {
  text-align: center;
  font-family: var(--font-round);
  font-weight: 800;
  font-size: clamp(22px, 5vw, 40px);
  min-height: 1.2em;
  margin: 6px 0;
}
.note-readout small { display:block; font-family: var(--font-body); font-weight:700; font-size: 15px; color: var(--ink-soft); }
.letter-btn {
  border: none;
  width: 60px; height: 60px;
  border-radius: 18px;
  font-family: var(--font-round);
  font-weight: 800;
  font-size: 26px;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(150deg, #7fb0ff, var(--blue));
  box-shadow: 0 5px 0 rgba(43,33,64,.18);
}
.letter-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(43,33,64,.18); }

/* ---------------------------- Clef Draw ---------------------------------- */
.draw-stage {
  position: relative;
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  background: #fff;
  box-shadow: var(--shadow-sm);
  touch-action: none;
}
.draw-stage canvas { display: block; width: 100%; height: auto; touch-action: none; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 42px; height: 42px; border-radius: 50%;
  border: 4px solid #fff; box-shadow: var(--shadow-sm); cursor: pointer;
}
.swatch.is-active { outline: 4px solid var(--ink); outline-offset: 2px; }

/* --------------------------- Song Library -------------------------------- */
.search-bar {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 999px; padding: 8px 18px;
  box-shadow: var(--shadow-sm); margin-bottom: 14px;
}
.search-bar input {
  border: none; outline: none; flex: 1;
  font-family: var(--font-body); font-size: 18px; font-weight: 600; color: var(--ink);
  background: transparent; min-width: 0;
}
.search-bar .mag { font-size: 22px; }

.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }

.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.song-card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 18px 18px 20px;
  border-top: 10px solid var(--sky);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.song-card h3 { font-family: var(--font-round); font-size: 21px; margin: 0; }
.song-card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 12.5px; font-weight: 800; font-family: var(--font-round);
  padding: 4px 11px; border-radius: 999px; color: #fff;
}
.tag--cat { background: var(--purple); }
.tag--meter { background: var(--teal); }
.tag--grade { background: var(--orange); }
.song-card .focus { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
.song-card .game {
  background: var(--cream); border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 15px; line-height: 1.45;
}
.song-card .game b { color: var(--pink); }
.song-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.mini-btn {
  border: none;
  border-radius: 999px;
  padding: 10px 16px;
  font-family: var(--font-round);
  font-weight: 800;
  font-size: 14.5px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  box-shadow: 0 4px 0 rgba(43,33,64,.14);
}
.mini-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43,33,64,.14); }
.mini-btn--play { background: linear-gradient(150deg, #8be86a, var(--lime)); color: #fff; }
.mini-btn--link { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
.empty-note { text-align: center; color: var(--ink-soft); font-weight: 700; padding: 40px 10px; }

/* ------------------------------ Utility ---------------------------------- */
.big-emoji-badge {
  display:inline-flex; align-items:center; justify-content:center;
  width: 64px; height: 64px; border-radius: 20px; font-size: 36px;
  background:#fff; box-shadow: var(--shadow-sm);
}
.hint { color: var(--ink-soft); font-weight: 700; font-size: 15px; }
.spacer-sm { height: 10px; }
.row-wrap { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }

/* ------------------------------ Piano ------------------------------------ */
.piano-wrap { overflow-x: auto; padding: 4px 2px 10px; }
.piano {
  position: relative; display: flex; height: 240px; min-width: 680px;
  user-select: none; touch-action: manipulation;
}
.pkey-white {
  position: relative; flex: 1; background: #fff;
  border: 2px solid var(--ink); border-radius: 0 0 10px 10px;
  margin-right: -2px; cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px;
  box-shadow: inset 0 -7px 0 rgba(43,33,64,.05);
}
.pkey-white:active, .pkey-white.active { background: linear-gradient(#ffe27a, #ffd23f); }
.pkey-white .lbl { font-family: var(--font-round); font-weight: 800; color: var(--ink-soft); font-size: 15px; }
.pkey-black {
  position: absolute; top: 0; height: 60%; background: var(--ink);
  border-radius: 0 0 8px 8px; z-index: 2; cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.35);
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
}
.pkey-black:active, .pkey-black.active { background: var(--purple); }
.pkey-black .lbl { color: #fff; font-family: var(--font-round); font-weight: 800; font-size: 10.5px; }

/* -------------------------- Rhythm Flashcards ---------------------------- */
.rhythm-card { text-align: center; }
.rhythm-beats { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 8px 0 4px; }
.rbeat { min-width: 84px; padding: 6px 4px; border-radius: 14px; }
.rbeat.hit { background: var(--yellow); }
.rbeat .glyph { display: flex; align-items: flex-end; justify-content: center; min-height: clamp(40px, 10vw, 64px); }
.rbeat .glyph .rnote-svg { height: clamp(40px, 10vw, 64px); width: auto; display: block; }
.rbeat .syl { font-family: var(--font-round); font-weight: 800; color: var(--ink-soft); font-size: 15px; }
.barline { width: 4px; align-self: stretch; background: var(--ink); border-radius: 2px; margin: 0 4px; }

/* ---------------------------- Ukulele Chords ----------------------------- */
.uke-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.uke-card {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-sm);
  padding: 14px 12px 18px; text-align: center; border-top: 10px solid var(--coral);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.uke-card h3 { margin: 0; font-family: var(--font-round); font-size: 26px; }
.uke-diagram { width: 100%; max-width: 160px; height: auto; }
.uke-tip { margin: 0; font-size: 13.5px; color: var(--ink-soft); font-weight: 700; line-height: 1.35; min-height: 2.6em; }

/* ----------------------------- Musical Terms ----------------------------- */
.term-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.term-card {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-sm);
  padding: 16px 18px 18px; border-left: 10px solid var(--grape);
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.term-cat-tag {
  font-size: 12px; font-weight: 800; font-family: var(--font-round); color: #fff;
  background: var(--grape); border-radius: 999px; padding: 3px 11px;
}
.term-card h3 { margin: 0; font-family: var(--font-round); font-size: 21px; }
.term-abbr { font-family: serif; font-style: italic; font-weight: 700; color: var(--pink); font-size: 16px; }
.term-card p { margin: 0; color: var(--ink-soft); font-weight: 600; font-size: 14.5px; line-height: 1.4; }

/* ------------------------- Orchestra Instruments ------------------------- */
.orch-section-head {
  display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
}
.orch-section-head:first-of-type { margin-top: 6px; }
.orch-section-emoji {
  width: 46px; height: 46px; border-radius: 14px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--sc, var(--sky)); box-shadow: var(--shadow-sm);
}
.orch-section-emoji .orch-svg { width: 24px; height: 24px; }
.orch-section-head h3 { margin: 0; font-family: var(--font-round); font-size: clamp(20px, 3.4vw, 26px); color: var(--sc, var(--ink)); }
.orch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.orch-card {
  border: none; border-radius: 18px; padding: 16px 10px; cursor: pointer;
  background: #fff; box-shadow: var(--shadow-sm); border-bottom: 7px solid var(--sc, var(--sky));
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.orch-card:active { transform: translateY(3px); }
.orch-card.flash { animation: orchflash .3s ease; }
@keyframes orchflash { 40% { transform: scale(1.06); background: var(--cream); } }
.orch-icon { display: flex; align-items: flex-end; justify-content: center; height: 56px; }
.orch-icon .orch-svg { height: 100%; width: auto; max-width: 64px; }
.orch-name { font-family: var(--font-round); font-weight: 800; font-size: 14.5px; color: var(--ink); text-align: center; }
.orch-credit { text-align: center; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; margin-top: 18px; }
.orch-credit a { color: var(--ink-soft); }

/* --------------------------- Composer Spotlight --------------------------- */
.composer-timeline { padding: 10px 4px 0; }
.timeline-bar { position: relative; height: 6px; background: #e3ddef; border-radius: 999px; margin: 30px 10px 22px; }
.timeline-dot {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 20px; height: 20px; border-radius: 50%; background: var(--dc, var(--pink));
  border: 4px solid #fff; box-shadow: var(--shadow-sm);
}
.timeline-dot-label {
  position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-round); font-weight: 800; font-size: 13px; color: var(--dc, var(--ink));
  white-space: nowrap;
}
.composer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.composer-card {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-sm);
  padding: 20px; display: flex; gap: 16px; border-top: 10px solid var(--ac, var(--purple));
}
.composer-avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  background: var(--ac, var(--purple)); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-round); font-weight: 800; font-size: 30px;
  box-shadow: var(--shadow-sm);
}
.composer-info h3 { margin: 0 0 2px; font-family: var(--font-round); font-size: 21px; }
.composer-meta { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
.composer-facts { margin: 0 0 10px; padding-left: 20px; }
.composer-facts li { font-size: 14.5px; line-height: 1.4; margin-bottom: 5px; color: var(--ink); }
.composer-works { font-size: 14px; color: var(--ink-soft); font-weight: 600; margin: 0 0 12px; line-height: 1.4; }

/* ------------------------------ Song Maker ------------------------------- */
.sm-gridwrap { overflow-x: auto; padding: 4px 2px 8px; }
.sm-grid { display: inline-flex; flex-direction: column; gap: 4px; min-width: 100%; }
.sm-row { display: flex; align-items: center; gap: 4px; }
.sm-rowlabel { width: 20px; flex: none; font-family: var(--font-round); font-weight: 800; font-size: 15px; text-align: center; }
.sm-cell {
  width: 34px; height: 30px; flex: none; border-radius: 7px;
  background: #ececf2; cursor: pointer; transition: transform .06s, filter .06s;
}
.sm-cell.beatstart { margin-left: 8px; }
.sm-cell.on { background: var(--cc); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.sm-cell.col-playing:not(.on) { background: #dcdce8; }
.sm-cell.on.col-playing { filter: brightness(1.2) saturate(1.15); transform: scale(1.08); }

/* ------------------------------ Beat Maker ------------------------------- */
.bm-board { overflow-x: auto; padding: 4px 2px; }
.bm-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bm-char {
  width: 78px; flex: none; border-radius: 16px; padding: 6px 4px;
  background: var(--ic, #eee); color: #fff; text-align: center;
  display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow-sm);
}
.bm-char-emoji { font-size: 34px; line-height: 1; }
.bm-char-name { font-family: var(--font-round); font-weight: 800; font-size: 12px; }
.bm-char.hit { animation: bmhit .22s ease; }
@keyframes bmhit {
  0% { transform: translateY(0) scale(1) rotate(0); }
  35% { transform: translateY(-10px) scale(1.16) rotate(-6deg); }
  100% { transform: translateY(0) scale(1) rotate(0); }
}
.bm-steps { display: flex; gap: 4px; }
.bm-step { width: 32px; height: 40px; flex: none; border-radius: 8px; background: #ececf2; cursor: pointer; transition: transform .06s, filter .06s; }
.bm-step.beatstart { margin-left: 8px; }
.bm-step.on { background: var(--ic); box-shadow: inset 0 -3px 0 rgba(0,0,0,.14); }
.bm-step.col-playing:not(.on) { background: #dcdce8; }
.bm-step.on.col-playing { filter: brightness(1.2); transform: scale(1.08); }

/* --------------------------------- Bells --------------------------------- */
.bells-stage { display: flex; justify-content: center; }
.bells-wrap { display: flex; align-items: flex-start; gap: clamp(6px, 1.4vw, 12px); height: 260px; }
.bell-bar {
  flex: 1 1 0; min-width: 40px; max-width: 90px;
  border: none; border-radius: 0 0 12px 12px; cursor: pointer;
  background: var(--bc); box-shadow: var(--shadow-sm);
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px;
  color: rgba(255,255,255,.95);
}
.bell-bar:active { transform: translateY(3px); }
.bell-bar.ring { animation: bellring .24s ease; }
@keyframes bellring { 40% { filter: brightness(1.3); transform: scale(1.04); } }
.bell-label { font-family: var(--font-round); font-weight: 800; font-size: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.bell-dots { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.bell-dot {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-round); font-weight: 800; color: #fff; font-size: 14px;
  text-shadow: 0 1px 2px rgba(0,0,0,.25); opacity: .9;
}
.bell-dot.now { outline: 4px solid var(--ink); outline-offset: 2px; transform: scale(1.18); opacity: 1; }

/* ----------------------------- Magic Link -------------------------------- */
.share-box {
  margin-top: 12px; background: var(--cream); border-radius: var(--radius-sm);
  padding: 14px 16px; text-align: center;
}
.share-msg { font-weight: 700; color: var(--ink); font-size: 15px; margin-bottom: 10px; line-height: 1.4; }
.share-input {
  width: 100%; border: 3px solid rgba(43,33,64,.12); border-radius: 12px;
  padding: 12px 14px; font-family: var(--font-body); font-weight: 700; font-size: 14px;
  color: var(--ink-soft); background: #fff; outline: none;
}
.share-input:focus { border-color: var(--blue); }

/* --------------------------- Install banner ------------------------------ */
.install-banner {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 40;
  width: min(560px, calc(100vw - 24px));
  background: #fff;
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: install-in .28s ease;
}
@keyframes install-in {
  from { transform: translateX(-50%) translateY(16px); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}
.install-banner__icon { font-size: 30px; flex: none; }
.install-banner__text { flex: 1; font-size: 13.5px; color: var(--ink); line-height: 1.35; }
.install-banner__text b { display: block; font-family: var(--font-round); font-size: 15px; }
.install-banner__btn {
  flex: none; border: none; border-radius: 999px; padding: 10px 18px;
  font-family: var(--font-round); font-weight: 800; font-size: 14.5px; color: #fff;
  background: linear-gradient(150deg, #ff8fc0, var(--pink)); cursor: pointer;
  box-shadow: 0 4px 0 rgba(43,33,64,.16);
}
.install-banner__btn:active { transform: translateY(3px); box-shadow: none; }
.install-banner__close {
  flex: none; border: none; background: transparent; color: var(--ink-soft);
  font-size: 16px; font-weight: 800; cursor: pointer; padding: 4px 6px;
}

@media (max-width: 520px) {
  .home-btn__text { display: none; }
  .tile { min-height: 150px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

// ---- js/sound.js ----
/* ==========================================================================
   sound.js — tiny Web Audio engine.
   No audio files: every sound is synthesized, so the app works fully offline
   on iPads and Chromebooks. Audio must be unlocked by a user gesture (tap),
   which the activities do via Sound.unlock() on their first button press.
   ========================================================================== */

window.Sound = (function () {
  var ctx = null;

  function ac() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    return ctx;
  }

  // Call inside a user gesture (tap) to satisfy mobile autoplay policies.
  function unlock() {
    var c = ac();
    if (c.state === "suspended") c.resume();
    return c;
  }

  // Percussive "click" for beats. accent = louder/higher (downbeat).
  function click(accent, when) {
    var c = ac();
    when = when || c.currentTime;
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = "square";
    osc.frequency.value = accent ? 1500 : 900;
    var peak = accent ? 0.5 : 0.32;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(peak, when + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    osc.connect(gain).connect(c.destination);
    osc.start(when);
    osc.stop(when + 0.1);
  }

  // A short pitched "boop" for rhythm sounds / note previews.
  // peak (0–1) sets loudness — used by the Musical Terms dynamics demos.
  function tone(freq, when, dur, type, peak) {
    var c = ac();
    when = when || c.currentTime;
    dur = dur || 0.18;
    peak = peak == null ? 0.28 : peak;
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(peak, when + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(when);
    osc.stop(when + dur + 0.02);
  }

  // A quick percussive "thump" at a chosen pitch — used to give each
  // orchestra percussion instrument (timpani, snare, cymbals…) its own feel.
  function perc(freq, when, dur, type) {
    var c = ac();
    when = when || c.currentTime;
    dur = dur || 0.16;
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(0.45, when + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(when);
    osc.stop(when + dur + 0.02);
  }

  // A burst of filtered white noise — the backbone of snare/hi-hat/clap sounds.
  // flavor: "hat" (bright/short), "snare" (mid), "clap" (mid, softer).
  function noise(when, dur, peak, flavor) {
    var c = ac();
    when = when || c.currentTime;
    dur = dur || 0.1;
    peak = peak == null ? 0.3 : peak;
    var n = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, n, c.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    var src = c.createBufferSource();
    src.buffer = buf;
    var gain = c.createGain();
    gain.gain.setValueAtTime(peak, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    if (flavor === "hat" || flavor === "snare" || flavor === "clap") {
      var hp = c.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = flavor === "hat" ? 7000 : 1400;
      src.connect(hp); hp.connect(gain);
    } else {
      src.connect(gain);
    }
    gain.connect(c.destination);
    src.start(when);
    src.stop(when + dur + 0.02);
  }

  // Load + decode an audio file once and cache the result, so real recorded
  // samples (e.g. orchestra instrument notes) can be played back like any
  // other sound. Returns a Promise<AudioBuffer>.
  var bufferCache = {};
  function loadBuffer(url) {
    if (bufferCache[url]) return bufferCache[url];
    // The single-file bundle (see build/bundle.js) inlines every sample as a
    // data: URI in this map so the app works with no server at all, e.g.
    // opened straight from disk. Normal deploys never set this global, so
    // this is a no-op there.
    var fetchUrl = (window.__EMBEDDED_AUDIO__ && window.__EMBEDDED_AUDIO__[url]) || url;
    var p = fetch(fetchUrl)
      .then(function (res) { return res.arrayBuffer(); })
      .then(function (data) {
        return new Promise(function (resolve, reject) {
          // decodeAudioData's callback form is the widest-compatible signature.
          ac().decodeAudioData(data, resolve, reject);
        });
      });
    bufferCache[url] = p;
    return p;
  }

  function playBuffer(buffer, when, peak) {
    var c = ac();
    when = when || c.currentTime;
    peak = peak == null ? 1 : peak;
    var src = c.createBufferSource();
    src.buffer = buffer;
    var gain = c.createGain();
    gain.gain.value = peak;
    src.connect(gain).connect(c.destination);
    src.start(when);
    return src;
  }

  // Note name (e.g. "C4") -> frequency in Hz, so the staff can sing pitches.
  var SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function noteFreq(name) {
    var m = /^([A-G])(#|b)?(\d)$/.exec(name);
    if (!m) return 440;
    var semis = SEMITONES[m[1]];
    if (m[2] === "#") semis += 1;
    if (m[2] === "b") semis -= 1;
    var midi = semis + (parseInt(m[3], 10) + 1) * 12; // MIDI number
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function playNote(name, dur) {
    tone(noteFreq(name), null, dur || 0.5, "sine");
  }

  function now() { return ac().currentTime; }

  // Play a melody: notes is an array of [noteName, beats] ("rest" = silence).
  // Returns the total duration in seconds so callers can re-enable a button.
  function playMelody(notes, tempo) {
    unlock();
    var beat = 60 / (tempo || 100);
    var t = now() + 0.06;
    notes.forEach(function (n) {
      var name = n[0], beats = n[1];
      var dur = beats * beat;
      if (name !== "rest") {
        tone(noteFreq(name), t, Math.max(0.12, dur * 0.9), "sine");
      }
      t += dur;
    });
    return (t - now());
  }

  return {
    unlock: unlock,
    click: click,
    tone: tone,
    perc: perc,
    noise: noise,
    loadBuffer: loadBuffer,
    playBuffer: playBuffer,
    playNote: playNote,
    playMelody: playMelody,
    noteFreq: noteFreq,
    now: now
  };
})();

// ---- js/app.js ----
/* ==========================================================================
   app.js — the small single-page "router" and shared UI helpers.
   Activities register themselves with App.register({...}). The home screen is
   built automatically from whatever is registered, so adding a new activity is
   a one-file job.
   ========================================================================== */

window.App = (function () {
  var view = null;
  var activities = [];   // registered activity descriptors
  var byId = {};
  var current = null;    // teardown fn for the active activity

  // ---- tiny DOM helper: el('div.card', {onclick:fn}, child, child...) ------
  function el(spec, attrs) {
    var parts = spec.split(/(?=[.#])/);
    var node = document.createElement(parts[0] || "div");
    for (var i = 1; i < parts.length; i++) {
      if (parts[i][0] === ".") node.classList.add(parts[i].slice(1));
      else if (parts[i][0] === "#") node.id = parts[i].slice(1);
    }
    if (attrs) {
      for (var k in attrs) {
        if (!attrs.hasOwnProperty(k)) continue;
        if (k === "html") node.innerHTML = attrs[k];
        else if (k === "text") node.textContent = attrs[k];
        else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (k === "style") node.setAttribute("style", attrs[k]);
        else node.setAttribute(k, attrs[k]);
      }
    }
    for (var a = 2; a < arguments.length; a++) {
      var c = arguments[a];
      if (c == null) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) node.appendChild(x); });
      else if (typeof c === "string") node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    }
    return node;
  }

  function register(descriptor) {
    activities.push(descriptor);
    byId[descriptor.id] = descriptor;
  }

  function clearView() {
    if (typeof current === "function") { try { current(); } catch (e) {} }
    current = null;
    view.innerHTML = "";
  }

  function goHome() {
    location.hash = "";
    renderHome();
  }

  // Standard page header with a Back button, used by every activity.
  function pageHead(emoji, title, subtitle) {
    return el("div.page-head", null,
      el("button.back-btn", { onclick: goHome, html: "← Home" }),
      el("span.emoji", { text: emoji }),
      el("div", null,
        el("h2", { text: title }),
        subtitle ? el("p", { text: subtitle }) : null
      )
    );
  }

  // Fire one custom event per activity/Home view. Guarded so a blocked or
  // slow-to-load analytics script can never break navigation.
  function trackView(id, title) {
    try {
      if (window.posthog) posthog.capture("activity_opened", { activity: id || "home", title: title || "Home" });
    } catch (e) {}
  }

  function renderHome() {
    clearView();
    trackView("home", "Home");
    var hero = el("div.hero", null,
      el("h1", { html: 'Welcome to the <span class="wave">Music Playground</span>!' }),
      el("p", { text: "Pick an activity below. Everything works with a tap — perfect for iPads, Chromebooks, and the classroom projector." })
    );
    var grid = el("div.tile-grid");
    activities.forEach(function (act) {
      var tile = el("button.tile." + act.color, {
        onclick: function () { open(act.id); },
        "aria-label": act.title
      },
        el("span.tile__emoji", { text: act.emoji }),
        el("div", null,
          el("div.tile__title", { text: act.title }),
          el("div.tile__desc", { text: act.desc })
        )
      );
      grid.appendChild(tile);
    });
    view.appendChild(hero);
    view.appendChild(grid);
    window.scrollTo(0, 0);
  }

  function open(id) {
    var act = byId[id];
    if (!act) return goHome();
    location.hash = id;
    clearView();
    trackView(id, act.title);
    // activity.render(container, helpers) may return a teardown function
    current = act.render(view, { el: el, pageHead: pageHead, goHome: goHome }) || null;
    window.scrollTo(0, 0);
  }

  function routeFromHash() {
    var id = (location.hash || "").replace(/^#/, "");
    if (id && byId[id]) open(id);
    else renderHome();
  }

  function start() {
    view = document.getElementById("view");

    document.getElementById("homeBtn").addEventListener("click", goHome);

    var fsBtn = document.getElementById("fullscreenBtn");
    fsBtn.addEventListener("click", function () {
      var d = document;
      if (!d.fullscreenElement && !d.webkitFullscreenElement) {
        var e = d.documentElement;
        (e.requestFullscreen || e.webkitRequestFullscreen || function(){}).call(e);
      } else {
        (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d);
      }
    });

    window.addEventListener("hashchange", routeFromHash);
    routeFromHash();

    initInstallBanner();
  }

  // ---- "Add to Home Screen" banner --------------------------------------
  // Chromebooks/Android/desktop Chrome fire beforeinstallprompt, so we can
  // trigger the real install flow. iPad Safari has no such event, so we show
  // simple manual instructions instead. Dismissal is remembered so it
  // doesn't nag on every visit.
  var DISMISS_KEY = "mp_install_dismissed_v1";
  var deferredInstallPrompt = null;

  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true;
  }
  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function initInstallBanner() {
    if (isStandalone()) return;
    var dismissed = false;
    try { dismissed = !!localStorage.getItem(DISMISS_KEY); } catch (e) {}
    if (dismissed) return;

    var banner = null;

    function showBanner(mode) {
      if (banner) return;
      banner = el("div.install-banner", null,
        el("span.install-banner__icon", { text: "📲" }),
        el("div.install-banner__text", null,
          el("b", { text: "Add Music Playground to your Home Screen!" }),
          el("span", { text: mode === "ios"
            ? " Tap the Share icon below, then \"Add to Home Screen.\""
            : " One tap to open, and it works offline too." })
        ),
        mode === "prompt" ? el("button.install-banner__btn", { text: "Install", onclick: doInstall }) : null,
        el("button.install-banner__close", { text: "✕", "aria-label": "Dismiss", onclick: dismissBanner })
      );
      document.body.appendChild(banner);
    }

    function dismissBanner() {
      if (banner) { banner.remove(); banner = null; }
      try { localStorage.setItem(DISMISS_KEY, "1"); } catch (e) {}
    }

    function doInstall() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(function () {
        deferredInstallPrompt = null;
        dismissBanner();
      });
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredInstallPrompt = e;
      showBanner("prompt");
    });

    if (isIOS()) {
      setTimeout(function () { showBanner("ios"); }, 1500);
    }
  }

  // ---- "Magic Link" sharing helpers -----------------------------------
  // Creations are encoded into a URL query param (?key=...) so a shared link
  // reopens the exact grid — no server needed, perfect for static hosting.

  function readParam(key) {
    try { return new URLSearchParams(location.search).get(key); }
    catch (e) { return null; }
  }

  // Read a param, then strip it from the address bar so navigating away and
  // back doesn't keep reloading the shared creation over the student's edits.
  function consumeParam(key) {
    var params;
    try { params = new URLSearchParams(location.search); } catch (e) { return null; }
    if (!params.has(key)) return null;
    var value = params.get(key);
    params.delete(key);
    var s = params.toString();
    history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + location.hash);
    return value;
  }

  function shareUrl(hashId, key, value) {
    return location.origin + location.pathname + "?" + key + "=" + encodeURIComponent(value) + "#" + hashId;
  }

  // Pack/unpack a "010110…" bit string as compact hex for short URLs.
  function bitsToHex(bits) {
    var hex = "";
    for (var i = 0; i < bits.length; i += 4) {
      var chunk = bits.substr(i, 4);
      while (chunk.length < 4) chunk += "0";
      hex += parseInt(chunk, 2).toString(16);
    }
    return hex;
  }
  function hexToBits(hex, len) {
    var bits = "";
    for (var i = 0; i < hex.length; i++) {
      var v = parseInt(hex.charAt(i), 16);
      if (isNaN(v)) v = 0;
      bits += ("000" + v.toString(2)).slice(-4);
    }
    while (bits.length < len) bits += "0";
    return bits.slice(0, len);
  }

  // Build the "Save My …" button + a reveal box that copies the link.
  // opts: { label, hashId, key, thing ("song"/"beat"), getValue: fn -> string }
  function shareControl(opts) {
    var box = el("div.share-box", { style: "display:none" });
    var btn = el("button.btn.btn--blue", { html: opts.label, onclick: function () {
      var url = shareUrl(opts.hashId, opts.key, opts.getValue());
      box.style.display = "";
      box.innerHTML = "";
      box.appendChild(el("div.share-msg", {
        html: "✨ Ta-da! Here's your <b>Magic Link</b> — it's copied! Paste it in a message, or open it later to hear your " + opts.thing + " again."
      }));
      var input = el("input.share-input", { type: "text", value: url, readonly: "readonly", "aria-label": "Your magic link" });
      input.addEventListener("focus", function () { input.select(); });
      box.appendChild(input);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).catch(function () {});
      }
      setTimeout(function () { input.focus(); input.select(); }, 30);
    }});
    return el("div", null, btn, box);
  }

  return {
    register: register,
    start: start,
    el: el,
    goHome: goHome,
    readParam: readParam,
    consumeParam: consumeParam,
    shareUrl: shareUrl,
    bitsToHex: bitsToHex,
    hexToBits: hexToBits,
    shareControl: shareControl
  };
})();

</script>

// ---- js/library.js ----
/* ==========================================================================
   library.js — searchable library of public-domain songs & rhymes, each
   paired with a classroom game. Filter by category & grade band, or search.
   ========================================================================== */

(function () {
  var CAT_COLORS = {
    "Patriotic": "var(--blue)",
    "Folk Song": "var(--lime)",
    "Nursery Rhyme": "var(--pink)",
    "Singing Game": "var(--purple)",
    "Seasonal": "var(--orange)"
  };

  function render(container, h) {
    var el = h.el;
    var state = { q: "", cat: "All", grade: "All" };

    container.appendChild(h.pageHead("🎵", "Song & Game Library",
      "Public-domain songs, rhymes & a game to play with each one."));

    // Search bar
    var input = el("input", {
      type: "search",
      placeholder: "Search songs, rhymes, or skills…",
      "aria-label": "Search songs",
      oninput: function () { state.q = input.value.toLowerCase(); draw(); }
    });
    var searchBar = el("div.search-bar", null, el("span.mag", { text: "🔍" }), input);
    container.appendChild(searchBar);

    // Filter chips: categories
    var catRow = el("div.filter-row");
    ["All"].concat(DATA.categories).forEach(function (c) {
      catRow.appendChild(chip(c, function () { state.cat = c; syncChips(catRow, c); draw(); }, c === "All"));
    });
    container.appendChild(catRow);

    // Filter chips: grades
    var gradeRow = el("div.filter-row");
    ["All"].concat(DATA.grades).forEach(function (g) {
      gradeRow.appendChild(chip(g, function () { state.grade = g; syncChips(gradeRow, g); draw(); }, g === "All"));
    });
    container.appendChild(gradeRow);

    var grid = el("div.song-grid");
    container.appendChild(grid);

    function chip(label, onclick, active) {
      var b = el("button.pill", { text: label, onclick: onclick });
      if (active) b.classList.add("is-active");
      b.dataset.label = label;
      return b;
    }
    function syncChips(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }

    function matches(song) {
      if (state.cat !== "All" && song.category !== state.cat) return false;
      if (state.grade !== "All" && song.grades.indexOf(state.grade) === -1) return false;
      if (state.q) {
        var hay = (song.title + " " + song.category + " " + song.focus + " " + song.game).toLowerCase();
        if (hay.indexOf(state.q) === -1) return false;
      }
      return true;
    }

    function draw() {
      grid.innerHTML = "";
      var list = DATA.songs.filter(matches);
      if (!list.length) {
        grid.appendChild(el("div.empty-note", { text: "No songs match yet — try clearing a filter. 🎶" }));
        return;
      }
      list.forEach(function (song) {
        var card = el("div.song-card");
        card.style.borderTopColor = CAT_COLORS[song.category] || "var(--sky)";
        card.appendChild(el("h3", { text: song.title }));

        var tags = el("div.tags", null,
          el("span.tag.tag--cat", { text: song.category }),
          el("span.tag.tag--meter", { text: song.meter }),
          el("span.tag.tag--grade", { text: song.grades.join(" · ") })
        );
        card.appendChild(tags);
        card.appendChild(el("div.focus", { html: "🎯 <b>Skills:</b> " + escapeHtml(song.focus) }));
        card.appendChild(el("div.game", { html: "<b>Play this:</b> " + escapeHtml(song.game) }));

        // Listen row: synthesized tune (offline) + a link to find a recording.
        var actions = el("div.song-actions");
        var mel = DATA.melodies[song.title];
        if (mel) {
          var tuneBtn = el("button.mini-btn.mini-btn--play", { html: "🔊 Play tune", onclick: function () {
            if (tuneBtn.disabled) return;
            var secs = Sound.playMelody(mel.notes, mel.tempo);
            tuneBtn.disabled = true;
            tuneBtn.style.opacity = "0.55";
            var was = tuneBtn.innerHTML;
            tuneBtn.innerHTML = "🎶 Playing…";
            setTimeout(function () {
              tuneBtn.disabled = false; tuneBtn.style.opacity = "1"; tuneBtn.innerHTML = was;
            }, (secs + 0.3) * 1000);
          }});
          actions.appendChild(tuneBtn);
        }
        var url = "https://www.youtube.com/results?search_query=" +
          encodeURIComponent(song.title + " song for kids");
        actions.appendChild(el("a.mini-btn.mini-btn--link", {
          href: url, target: "_blank", rel: "noopener noreferrer", html: "🎬 Find a recording"
        }));
        card.appendChild(actions);

        grid.appendChild(card);
      });
    }

    draw();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  App.register({
    id: "library",
    title: "Song & Game Library",
    emoji: "🎵",
    desc: "Public-domain songs & rhymes with a game for each.",
    color: "tile--pink",
    render: render
  });
})();

</script>
  <script>
// ---- js/beatboxes.js ----
/* ==========================================================================
   beatboxes.js — tappable fruit/veggie rhythm boxes.
   Each box is one beat. Tap a box to cycle its rhythm (quarter, two eighths,
   four sixteenths, triplet, rest) shown as fruit. Press Play and the app claps
   through the boxes so students hear beat & subdivision. Tempo + beat count
   are adjustable.
   ========================================================================== */

(function () {
  function render(container, h) {
    var el = h.el;
    var RH = DATA.rhythms;

    var state = {
      count: 4,
      tempo: 92,          // BPM (macro beat)
      boxes: [],          // rhythm id per box
      playing: false,
      timer: null,
      pos: 0
    };
    function defaultBoxes(n) {
      var a = [];
      for (var i = 0; i < n; i++) a.push("quarter");
      return a;
    }
    state.boxes = defaultBoxes(state.count);

    container.appendChild(h.pageHead("🍎", "Beat Boxes",
      "Tap a box to change its rhythm, then press Play to clap along."));

    // ---- Controls: beat count -------------------------------------------
    var countGroup = el("div.pill-group");
    [2, 3, 4, 6, 8].forEach(function (n) {
      var p = el("button.pill", { text: n + " beats", onclick: function () {
        state.count = n;
        state.boxes = defaultBoxes(n);
        syncPills(countGroup, n + " beats");
        stop();
        drawBoxes();
      }});
      if (n === state.count) p.classList.add("is-active");
      p.dataset.label = n + " beats";
      countGroup.appendChild(p);
    });

    // ---- Controls: tempo -------------------------------------------------
    var tempoVal = el("b", { text: state.tempo + "" });
    var tempo = el("input", {
      type: "range", min: "20", max: "500", value: state.tempo + "",
      "aria-label": "Tempo",
      oninput: function () { state.tempo = +tempo.value; tempoVal.textContent = tempo.value; }
    });
    var tempoLabel = el("label.slider", null, el("span", { text: "🐢 Tempo " }), tempo,
      el("span", null, tempoVal, el("span", { text: " BPM 🐇" })));

    var controls = el("div.card", null,
      el("div.control-row", null, el("span.hint", { text: "How many beats?" }), countGroup),
      el("div.spacer-sm"),
      el("div.control-row", null, tempoLabel)
    );
    container.appendChild(controls);

    // ---- The row(s) of beat boxes ---------------------------------------
    // 6 and 8 beats wrap onto two rows (3+3, 4+4) so they read like measures.
    var boxRows = el("div");
    var boxStage = el("div.card", null, boxRows);
    container.appendChild(boxStage);

    // ---- Play / Reset ----------------------------------------------------
    var playBtn = el("button.btn.btn--play", { html: "▶︎ Play", onclick: toggle });
    var resetBtn = el("button.btn.btn--ghost", { html: "↺ Reset", onclick: function () {
      state.boxes = defaultBoxes(state.count); stop(); drawBoxes();
    }});
    container.appendChild(el("div.control-row", null, playBtn, resetBtn));

    // ---- Legend ----------------------------------------------------------
    var legend = el("div.legend");
    RH.forEach(function (r) {
      legend.appendChild(el("span", { html: "<b>" + r.fruits + "</b> = " + escapeHtml(r.name) }));
    });
    container.appendChild(el("div.card", null,
      el("div.hint", { text: "What the fruit mean:" }), legend,
      el("div.spacer-sm"),
      el("p.hint", { text: "Tip: 🍒🍒 \"ti-ti\" fits in the same beat as one 🍐 \"ta\" — that's how we split the beat!" })
    ));

    drawBoxes();

    // ---------------------------------------------------------------------
    function rhythmById(id) {
      for (var i = 0; i < RH.length; i++) if (RH[i].id === id) return RH[i];
      return RH[0];
    }
    function cycle(id) {
      var idx = RH.map(function (r) { return r.id; }).indexOf(id);
      return RH[(idx + 1) % RH.length].id;
    }

    function perRow() {
      if (state.count === 6) return 3;   // 3 + 3
      if (state.count === 8) return 4;   // 4 + 4
      return state.count;                // everything else: one row
    }

    function drawBoxes() {
      boxRows.innerHTML = "";
      var n = perRow();
      var row = null;
      state.boxes.forEach(function (id, i) {
        if (i % n === 0) { row = el("div.beat-row"); boxRows.appendChild(row); }
        var r = rhythmById(id);
        var box = el("button.beat-box", {
          onclick: function () {
            // Change the rhythm silently — no audition sound on tap.
            state.boxes[i] = cycle(id);
            drawBoxes();
            flash(i);
          }
        },
          el("span.count", { text: (i + 1) + "" }),
          el("span.fruits", { text: r.fruits }),
          el("span.syllable", { text: r.syllable })
        );
        box.dataset.i = i;
        row.appendChild(box);
      });
    }

    function boxEl(i) { return boxRows.querySelector('.beat-box[data-i="' + i + '"]'); }

    function flash(i) {
      var b = boxEl(i);
      if (!b) return;
      b.classList.remove("flash");
      void b.offsetWidth;   // restart animation
      b.classList.add("flash");

    // Schedule the little clap(s) inside one beat for a rhythm
    function playHits(r, t0, beatSec) {
      if (r.hits === 0) return; // rest — silence
      var step = beatSec / r.hits;
      for (var k = 0; k < r.hits; k++) {
        Sound.click(k === 0, t0 + k * step);

    // ---- Playback loop ---------------------------------------------------
    function toggle() { state.playing ? stop() : play(); }

    function play() {
      Sound.unlock();
      state.playing = true;
      state.pos = 0;
      playBtn.innerHTML = "⏸ Stop";
      playBtn.classList.remove("btn--play");
      playBtn.classList.add("btn--stop");
      tick();

    function tick() {
      if (!state.playing) return;
      var beatSec = 60 / state.tempo;
      var i = state.pos % state.count;
      var r = rhythmById(state.boxes[i]);
      playHits(r, Sound.now() + 0.01, beatSec);
      flash(i);
      state.pos++;
      state.timer = setTimeout(tick, beatSec * 1000);

    function stop() {
      state.playing = false;
      if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      playBtn.innerHTML = "▶︎ Play";
      playBtn.classList.add("btn--play");
      playBtn.classList.remove("btn--stop");
    }

    function syncPills(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }

    return stop; // teardown when leaving the page
  }

    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  App.register({
    id: "beatboxes",
    title: "Beat Boxes",
    emoji: "🍎",
    desc: "Fruit & veggie boxes for beat and beat-division.",
    color: "tile--orange",
    render: render
  });
})();

// ---- js/staff.js ----
/* ==========================================================================
   staff.js — interactive staff basics with two modes.
     • Explore: tap any line or space and it names the note, hears it, and can
       label every line/space with the classic mnemonics.
     • Quiz: the app shows a mystery note; the student taps the letter they
       think it is and gets instant feedback plus a running score.
   ========================================================================== */

(function () {
  var SVGNS = "http://www.w3.org/2000/svg";

  // Vertical positions (y) for the 9 staff slots, top -> bottom.
  // index 0 = top line (line 5) ... index 8 = bottom line (line 1).
  var Y = [90, 102, 114, 126, 138, 150, 162, 174, 186];

  // Y alternates line, space, line, ... so adjacent slots are HALF a staff
  // space apart; a full space (line to line) is twice that.
  var STAFF_SPACE = 2 * (Y[1] - Y[0]);

  var CLEFS = {
    treble: {
      shape: "treble", anchorIdx: 6, // spiral wraps the G line (2nd from bottom)
      notes: ["F5", "E5", "D5", "C5", "B4", "A4", "G4", "F4", "E4"],
      lineMnemonic: "Every Good Boy Does Fine (E-G-B-D-F, bottom→top)",
      spaceMnemonic: "F-A-C-E (bottom→top) spells FACE"
    },
    bass: {
      shape: "bass", anchorIdx: 2, // dots straddle the F line (2nd from top)
      notes: ["A3", "G3", "F3", "E3", "D3", "C3", "B2", "A2", "G2"],
      lineMnemonic: "Good Boys Do Fine Always (G-B-D-F-A, bottom→top)",
      spaceMnemonic: "All Cows Eat Grass (A-C-E-G, bottom→top)"
    }
  };

  function svgEl(name, attrs) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    return n;
  }

  function render(container, h) {
    var el = h.el;
    var state = { clef: "treble", mode: "explore", showLabels: false,
                  placedSlot: null, quizSlot: null, answered: false, score: 0, total: 0 };

    container.appendChild(h.pageHead("🎼", "Staff Basics", "Learn the lines and spaces of the staff."));

    // ---- Mode + clef controls -------------------------------------------
    var modeGroup = el("div.pill-group");
    [["explore", "👆 Explore"], ["quiz", "❓ Quiz Me"]].forEach(function (c) {
      var p = el("button.pill", { text: c[1], onclick: function () {
        state.mode = c[0]; syncPills(modeGroup, c[1]); rebuild();
      }});
      if (c[0] === state.mode) p.classList.add("is-active");
      p.dataset.label = c[1];
      modeGroup.appendChild(p);
    });

    var clefGroup = el("div.pill-group");
    [["treble", "𝄞 Treble"], ["bass", "𝄢 Bass"]].forEach(function (c) {
      var p = el("button.pill", { text: c[1], onclick: function () {
        state.clef = c[0]; syncPills(clefGroup, c[1]);
        state.placedSlot = null;
        if (state.mode === "quiz") newQuestion(); else draw();
      }});
      if (c[0] === state.clef) p.classList.add("is-active");
      p.dataset.label = c[1];
      clefGroup.appendChild(p);
    });

    var labelBtn = el("button.pill", { text: "🔤 Show note names", onclick: function () {
      state.showLabels = !state.showLabels;
      labelBtn.classList.toggle("is-active", state.showLabels);
      draw();
    }});

    container.appendChild(el("div.card", null,
      el("div.control-row", null, modeGroup),
      el("div.spacer-sm"),
      el("div.control-row", null, clefGroup, labelBtn)
    ));

    // ---- Staff + readout -------------------------------------------------
    var readout = el("div.note-readout", { html: "&nbsp;" });
    var wrap = el("div.staff-wrap");
    container.appendChild(el("div.card", null, readout, wrap));

    // ---- Quiz answer buttons (letters) ----------------------------------
    var LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
    var answersRow = el("div.control-row", { style: "justify-content:center" });
    LETTERS.forEach(function (L) {
      answersRow.appendChild(el("button.letter-btn", { text: L, onclick: function () { answerLetter(L); } }));
    });
    var nextBtn = el("button.btn.btn--play", { html: "Next note →", style: "display:none", onclick: newQuestion });
    var scoreLine = el("div.hint", { text: "Score: 0 / 0", style: "text-align:center;margin-top:8px" });
    var quizCard = el("div.card", null, answersRow, el("div.spacer-sm"),
      el("div.control-row", { style: "justify-content:center" }, nextBtn), scoreLine);
    container.appendChild(quizCard);

    // ---- Mnemonics -------------------------------------------------------
    var mnemonicCard = el("div.card");
    container.appendChild(mnemonicCard);

    rebuild();

    // =====================================================================
    function rebuild() {
      var quiz = state.mode === "quiz";
      quizCard.style.display = quiz ? "" : "none";
      labelBtn.style.display = quiz ? "none" : "";
      if (quiz) { newQuestion(); }
      else {
        state.quizSlot = null; state.answered = false;
        readout.innerHTML = "Tap any line or space to hear it and see its name. 🎵";
        draw();
      }
    }

    function drawNote(svg, slot, color) {
      var y = Y[slot], cx = 430;
      var stem = svgEl("line", { x1: cx + 14, y1: y, x2: cx + 14, y2: y - 60,
        stroke: color.stroke, "stroke-width": 3 });
      var head = svgEl("ellipse", { cx: cx, cy: y, rx: 15, ry: 11, fill: color.fill,
        stroke: color.stroke, "stroke-width": 2, transform: "rotate(-20 " + cx + " " + y + ")" });
      svg.appendChild(stem);
      svg.appendChild(head);
    }

    function draw() {
      var clef = CLEFS[state.clef];
      var W = 720, H = 300, x0 = 60, x1 = 680;
      var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "staff-svg", width: W });

      [0, 2, 4, 6, 8].forEach(function (idx) {
        svg.appendChild(svgEl("line", { x1: x0, y1: Y[idx], x2: x1, y2: Y[idx],
          stroke: "#2b2140", "stroke-width": 3, "stroke-linecap": "round" }));
      });

      // The outline's origin sits on the line the clef names, so anchoring it
      // is just a translate — no font measuring, identical on every device.
      svg.appendChild(svgEl("path", {
        d: Clefs[clef.shape].d, fill: "#2b2140",
        transform: "translate(66," + Y[clef.anchorIdx] + ") scale(" + STAFF_SPACE + ")"
      }));

      // Labels only make sense in Explore (would give away the Quiz answer).
      if (state.mode === "explore" && state.showLabels) {
        Y.forEach(function (y, idx) {
          var isLine = idx % 2 === 0;
          var t = svgEl("text", { x: 700, y: y + 6, "font-size": 20, "text-anchor": "end",
            fill: isLine ? "#5b8cff" : "#ff5da2", "font-family": "'Baloo 2', sans-serif", "font-weight": "800" });
          t.textContent = clef.notes[idx].replace(/\d/, "");
          svg.appendChild(t);
        });
      }

      // Show the current note (explore = placed, quiz = mystery note).
      if (state.mode === "quiz" && state.quizSlot != null) {
        drawNote(svg, state.quizSlot, { fill: "#a06bff", stroke: "#7a45d6" });
      } else if (state.mode === "explore" && state.placedSlot != null) {
        drawNote(svg, state.placedSlot, { fill: "#ff7a59", stroke: "#c94a2a" });
      }

      // Clickable bands (Explore only).
      if (state.mode === "explore") {
        var bandH = 12;
        Y.forEach(function (y, idx) {
          var band = svgEl("rect", { x: x0, y: y - bandH / 2, width: (x1 - x0), height: bandH,
            fill: "transparent", style: "cursor:pointer" });
          function place() {
            state.placedSlot = idx;
            draw();
            announce(idx);
            Sound.playNote(clef.notes[idx], 0.7);
          }
          band.addEventListener("click", place);
          band.addEventListener("touchstart", function (e) { e.preventDefault(); place(); }, { passive: false });
          svg.appendChild(band);
        });
      }

      wrap.innerHTML = "";
      wrap.appendChild(svg);

      mnemonicCard.innerHTML = "";
      mnemonicCard.appendChild(el("div.hint", { text: "Remember the names:" }));
      mnemonicCard.appendChild(el("p", { html: "🟦 <b>Lines:</b> " + clef.lineMnemonic }));
      mnemonicCard.appendChild(el("p", { html: "🟥 <b>Spaces:</b> " + clef.spaceMnemonic }));
    }

    function announce(idx) {
      var clef = CLEFS[state.clef];
      var name = clef.notes[idx];
      var pretty = name.replace(/(\d)/, "");
      var isLine = idx % 2 === 0;
      readout.innerHTML = "That's <span style='color:" + (isLine ? "#5b8cff" : "#ff5da2") + "'>" + pretty +
        "</span>! <small>" + (isLine ? "a LINE note" : "a SPACE note") + " · octave " + name.replace(/\D/g, "") + "</small>";
    }

    // ---- Quiz logic ------------------------------------------------------
    function newQuestion() {
      var clef = CLEFS[state.clef];
      state.quizSlot = Math.floor(Math.random() * 9);
      state.answered = false;
      nextBtn.style.display = "none";
      setLetters(true);
      readout.innerHTML = "🤔 What note is this? Tap a letter.";
      draw();
      Sound.playNote(clef.notes[state.quizSlot], 0.7); // let them hear it too
    }

    function answerLetter(L) {
      if (state.answered || state.quizSlot == null) return;
      state.answered = true;
      state.total++;
      var clef = CLEFS[state.clef];
      var correct = clef.notes[state.quizSlot].charAt(0);
      var isLine = state.quizSlot % 2 === 0;
      if (L === correct) {
        state.score++;
        readout.innerHTML = "🌟 Yes! That's <span style='color:#7ed957'>" + correct + "</span> — " +
          (isLine ? "a line note." : "a space note.");
        Sound.tone(880, null, 0.12, "square");
      } else {
        readout.innerHTML = "Not quite — that one is <span style='color:#ff5da2'>" + correct + "</span>. " +
          "You picked " + L + ".";
        Sound.tone(220, null, 0.18, "sawtooth");
      }
      Sound.playNote(clef.notes[state.quizSlot], 0.7);
      scoreLine.textContent = "Score: " + state.score + " / " + state.total;
      nextBtn.style.display = "";
      setLetters(false);
    }

    function setLetters(on) {
      Array.prototype.forEach.call(answersRow.children, function (b) {
        b.disabled = !on;
        b.style.opacity = on ? "1" : "0.5";
      });
    }

    function syncPills(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }
  }

  App.register({
    id: "staff",
    title: "Staff Basics",
    emoji: "🎼",
    desc: "Explore the staff, or quiz yourself on note names.",
    color: "tile--sky",
    render: render
  });
})();

  <script>
// ---- js/clefdraw.js ----
/* ==========================================================================
   clefdraw.js — trace-the-clef drawing tool.
   A faint guide clef sits on a staff behind a canvas. Kids trace it with a
   finger or stylus (Pointer Events, so it works on iPad + Chromebook touch +
   mouse). Color swatches, brush size, undo, clear, and a guide toggle.
   ========================================================================== */

(function () {
  var COLORS = ["#ff5da2", "#ff7a59", "#ffab3d", "#7ed957", "#38bdf8", "#a06bff", "#2b2140"];

  // Draws a clef outline anchored on the staff line it names — the F line for
  // bass, the G line for treble. The outline's own origin is that line, so
  // this is just a translate + scale, identical on every device.
  function drawClef(ctx, shape, x, lineY, staffSpace, alpha) {
    var path = Clefs.path2d(shape);
    if (!path) return; // no Path2D support — staff still draws, just no guide
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#2b2140";
    ctx.translate(x, lineY);
    ctx.scale(staffSpace, staffSpace);
    ctx.fill(path);
    ctx.restore();
  }

  function render(container, h) {
    var el = h.el;
    var state = { clef: "treble", color: COLORS[5], size: 10, showGuide: true, strokes: [], drawing: null };

    container.appendChild(h.pageHead("✏️", "Clef Drawing",
      "Trace the clef with your finger or stylus. Then try it on your own!"));

    // Clef + guide toggle
    var clefGroup = el("div.pill-group");
    [["treble", "𝄞 Treble clef"], ["bass", "𝄢 Bass clef"]].forEach(function (c) {
      var p = el("button.pill", { text: c[1], onclick: function () {
        state.clef = c[0]; syncPills(clefGroup, c[1]); redraw();
      }});
      if (c[0] === state.clef) p.classList.add("is-active");
      p.dataset.label = c[1];
      clefGroup.appendChild(p);
    });
    var guideBtn = el("button.pill.is-active", { text: "👀 Guide", onclick: function () {
      state.showGuide = !state.showGuide;
      guideBtn.classList.toggle("is-active", state.showGuide);
      redraw();
    }});
    container.appendChild(el("div.card", null, el("div.control-row", null, clefGroup, guideBtn)));

    // Color swatches + brush size
    var swatches = el("div.swatches");
    COLORS.forEach(function (c) {
      var s = el("div.swatch", { onclick: function () { state.color = c; syncSwatch(); } });
      s.style.background = c;
      s.dataset.color = c;
      if (c === state.color) s.classList.add("is-active");
      swatches.appendChild(s);
    });
    function syncSwatch() {
      Array.prototype.forEach.call(swatches.children, function (s) {
        s.classList.toggle("is-active", s.dataset.color === state.color);
      });
    }
    var sizeInput = el("input", {
      type: "range", min: "4", max: "26", value: state.size + "", "aria-label": "Brush size",
      oninput: function () { state.size = +sizeInput.value; }
    });
    container.appendChild(el("div.card", null,
      el("div.control-row", null, el("span.hint", { text: "Color:" }), swatches),
      el("div.spacer-sm"),
      el("div.control-row", null, el("label.slider", null, el("span", { text: "🖌 Brush" }), sizeInput))
    ));

    // Canvas stage — tall enough to fit a full-height clef above & below the staff
    var W = 720, Hh = 500;
    var canvas = el("canvas");
    canvas.width = W; canvas.height = Hh;
    var stage = el("div.draw-stage", null, canvas);
    container.appendChild(stage);
    var ctx = canvas.getContext("2d");

    // Buttons
    container.appendChild(el("div.control-row", null,
      el("button.btn.btn--ghost", { html: "↶ Undo", onclick: function () { state.strokes.pop(); redraw(); } }),
      el("button.btn.btn--stop", { html: "🧽 Clear", onclick: function () { state.strokes = []; redraw(); } })
    ));

    // ---- Drawing via Pointer Events -------------------------------------
    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var x = (e.clientX - r.left) * (canvas.width / r.width);
      var y = (e.clientY - r.top) * (canvas.height / r.height);
      return { x: x, y: y };
    }
    canvas.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      state.drawing = { color: state.color, size: state.size, points: [pos(e)] };
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!state.drawing) return;
      e.preventDefault();
      state.drawing.points.push(pos(e));
      redraw();
    });
    function endStroke() {
      if (state.drawing) { state.strokes.push(state.drawing); state.drawing = null; redraw(); }
    }
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("pointerleave", endStroke);

    redraw();

    // ---- Rendering -------------------------------------------------------
    function drawStaff() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, Hh);
      // 5 lines (numbered bottom→top: line 1 is the bottom line)
      var top = 170, gap = 42;
      ctx.strokeStyle = "#e3ddef";
      ctx.lineWidth = 3;
      for (var i = 0; i < 5; i++) {
        var y = top + i * gap;
        ctx.beginPath(); ctx.moveTo(70, y); ctx.lineTo(W - 40, y); ctx.stroke();
      }
      var gLineY = top + 3 * gap;  // 2nd line from bottom (the G line — treble spiral)
      var fLineY = top + 1 * gap;  // 2nd line from top (the F line — the bass clef's two dots straddle it)

      if (state.showGuide) {
        if (state.clef === "bass") {
          drawClef(ctx, "bass", 96, fLineY, gap, 0.16);
        } else {
          drawClef(ctx, "treble", 96, gLineY, gap, 0.16);
        }
      }
    }

    function drawStroke(s) {
      if (!s.points.length) return;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineJoin = ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (var i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      if (s.points.length === 1) { ctx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1); }
      ctx.stroke();
    }

    function redraw() {
      drawStaff();
      state.strokes.forEach(drawStroke);
      if (state.drawing) drawStroke(state.drawing);
    }

    function syncPills(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }
  }

  App.register({
    id: "clefdraw",
    title: "Clef Drawing",
    emoji: "✏️",
    desc: "Trace treble & bass clefs with finger or stylus.",
    color: "tile--purple",
    render: render
  });
})();

</script>

(function () {

      oninput: function () { state.tempo = +tempo.value; tempoVal.textContent = tempo.value; } });

    [2, 3, 4, 6].forEach(function (n) {
      var p = el("button.pill", { text: n + "/4", onclick: function () {
        state.beats = n; syncPills(meterGroup, n + "/4");
      }});
      if (n === state.beats) p.classList.add("is-active");
      p.dataset.label = n + "/4";

    });
    container.appendChild(el("div.card", null,
      el("div.control-row", null, el("label.slider", null, el("span", { text: "🐢 Tempo " }), tempo,
        el("span", null, tempoVal, el("span", { text: " BPM 🐇" })))),
      el("div.spacer-sm"),
      el("div.control-row", null, el("span.hint", { text: "Beats per measure:" }), meterGroup)
    ));

    function buildDots() {
      dotsRow.innerHTML = "";

    }
    function dotStyle(active) {

        "background:" + (active ? "var(--pink)" : "#e3ddef") + ";box-shadow:var(--shadow-sm);";
    }

      style: "width:100%;min-height:200px;border:none;border-radius:26px;cursor:pointer;" +

        "font-weight:800;font-size:32px;box-shadow:var(--shadow);",

      Sound.click(accent, Sound.now() + 0.005);

      dots.forEach(function (d, k) { d.style.cssText = dotStyle(false); });

        state.good++;

    emoji: "🥁",

/* ==========================================================================
   piano.js — a tappable two-octave piano (C4–C6).
   Tap keys to hear the pitch and see its name. Toggle note-name labels for
   beginners. Works with touch, stylus, and mouse.
   ========================================================================== */

(function () {
  var WHITE = ["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5","G5","A5","B5","C6"];
  // Each black key sits after the given white-key index.
  var BLACK = [
    { n: "C#4", after: 0 }, { n: "D#4", after: 1 }, { n: "F#4", after: 3 },
    { n: "G#4", after: 4 }, { n: "A#4", after: 5 },
    { n: "C#5", after: 7 }, { n: "D#5", after: 8 }, { n: "F#5", after: 10 },
    { n: "G#5", after: 11 }, { n: "A#5", after: 12 }
  ];

  function render(container, h) {
    var el = h.el;
    var state = { showLabels: true };

    container.appendChild(h.pageHead("🎹", "Piano Keyboard",
      "Tap the keys to hear each note. Turn labels on or off to practice."));

    var labelBtn = el("button.pill.is-active", { text: "🔤 Note names", onclick: function () {
      state.showLabels = !state.showLabels;
      labelBtn.classList.toggle("is-active", state.showLabels);
      updateLabels();
    }});
    container.appendChild(el("div.card", null, el("div.control-row", null, labelBtn)));

    var readout = el("div.note-readout", { html: "Tap a key to play! 🎶" });
    var pianoWrap = el("div.piano-wrap");
    var piano = el("div.piano");
    pianoWrap.appendChild(piano);
    container.appendChild(el("div.card", null, readout, pianoWrap));

    container.appendChild(el("div.card", null,
      el("p.hint", { text: "The white keys spell C-D-E-F-G-A-B and repeat. Two white keys with a black key between them are a whole step; touching keys are a half step." })
    ));

    // ---- Build white keys ----
    var whiteEls = [];
    WHITE.forEach(function (note) {
      var key = el("div.pkey-white", null, el("span.lbl", { text: prettied(note) }));
      key.dataset.note = note;
      attachPlay(key, note);
      piano.appendChild(key);
      whiteEls.push(key);
    });

    // ---- Build black keys (absolute-positioned over the whites) ----
    var whiteW = 100 / WHITE.length;         // width of one white key in %
    var blackW = whiteW * 0.62;
    BLACK.forEach(function (b) {
      var key = el("div.pkey-black", null, el("span.lbl", { text: prettied(b.n) }));
      key.dataset.note = b.n;
      var centerPct = (b.after + 1) * whiteW;  // boundary between two whites
      key.style.width = blackW + "%";
      key.style.left = (centerPct - blackW / 2) + "%";
      attachPlay(key, b.n);
      piano.appendChild(key);
    });

    updateLabels();

    function attachPlay(key, note) {
      function play(e) {
        if (e) e.preventDefault();
        Sound.unlock();
        Sound.playNote(note, 0.9);
        readout.innerHTML = "🎵 <b>" + prettied(note) + "</b>";
        key.classList.add("active");
        setTimeout(function () { key.classList.remove("active"); }, 180);

    function updateLabels() {
      var labels = piano.querySelectorAll(".lbl");

        l.style.visibility = state.showLabels ? "visible" : "hidden";
      });
    }
  }

  // "C#4" -> "C♯", "C4" -> "C" for a friendly label.
  function prettied(note) {
    return note.replace("#", "♯").replace(/\d/, "");
  }

    id: "piano",
    title: "Piano Keyboard",
    emoji: "🎹",
    desc: "Tap a two-octave keyboard and hear every note.",
    color: "tile--indigo",
    render: render
  });
