  <script>
// ---- js/rhythmcards.js ----
/* ==========================================================================
   rhythmcards.js — rhythm flashcards / echo-clap.
   Shows a 4-beat rhythm using note symbols and syllables. "Clap it for me"
   plays the pattern (with a count-in) so students can echo it back; "New card"
   deals a fresh one. Easy / Medium / Hard change which rhythms appear.
   ========================================================================== */

(function () {
  // Hand-drawn SVG note icons rather than Unicode music characters ("♩♫♬𝄽")
  // — those glyphs render inconsistently (or as a missing-tofu box, as with
  // the quarter rest) depending on the device's installed fonts. These are
  // plain vector shapes, so they look identical and correct everywhere.
  var NOTEHEAD = '<ellipse cx="{cx}" cy="82" rx="{r}" ry="{ry}" fill="#2b2140" transform="rotate(-18 {cx} 82)"/>';
  var STEM = '<rect x="{x}" y="{y}" width="{w}" height="{h}" fill="#2b2140"/>';
  function tpl(s, vals) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vals[k]; }); }

  var ICONS = {
    quarter: '<svg viewBox="0 0 40 96" class="rnote-svg">' +
      tpl(NOTEHEAD, { cx: 16, r: 14, ry: 10.5 }) +
      tpl(STEM, { x: 27, y: 14, w: 6, h: 70 }) +
      '</svg>',
    eighths: '<svg viewBox="0 0 106 96" class="rnote-svg">' +
      tpl(NOTEHEAD, { cx: 16, r: 14, ry: 10.5 }) + tpl(STEM, { x: 27, y: 20, w: 6, h: 64 }) +
      tpl(NOTEHEAD, { cx: 76, r: 14, ry: 10.5 }) + tpl(STEM, { x: 87, y: 20, w: 6, h: 64 }) +
      tpl(STEM, { x: 27, y: 20, w: 66, h: 10 }) + // flat beam joining both stems
      '</svg>',
    sixteenths: '<svg viewBox="0 0 180 96" class="rnote-svg">' +
      [16, 62, 108, 154].map(function (cx) {
        return tpl(NOTEHEAD, { cx: cx, r: 13, ry: 9.5 }) + tpl(STEM, { x: cx + 10, y: 16, w: 5.5, h: 66 });
      }).join("") +
      tpl(STEM, { x: 26, y: 16, w: 143.5, h: 9 }) + tpl(STEM, { x: 26, y: 29, w: 143.5, h: 9 }) + // double flat beam
      '</svg>',
    rest: '<svg viewBox="0 0 40 70" class="rnote-svg">' +
      '<path d="M 26,6 C 30,12 20,16 24,22 L 8,36 L 28,46 L 10,58 C 6,62 8,66 14,64" ' +
      'fill="none" stroke="#2b2140" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>'
  };

  // One beat's worth of rhythm. hits = onset positions within the beat (0–1).
  var VALUES = {
    quarter:    { icon: ICONS.quarter,    syl: "ta",          hits: [0] },
    eighths:    { icon: ICONS.eighths,    syl: "ti-ti",       hits: [0, 0.5] },
    sixteenths: { icon: ICONS.sixteenths, syl: "ti-ka-ti-ka", hits: [0, .25, .5, .75] },
    rest:       { icon: ICONS.rest,       syl: "sh",          hits: [] }
  };
  var LEVELS = {
    "Easy":   ["quarter", "quarter", "eighths", "rest"],
    "Medium": ["quarter", "eighths", "eighths", "sixteenths", "rest"],
    "Hard":   ["quarter", "eighths", "sixteenths", "sixteenths", "rest", "eighths"]
  };

  function render(container, h) {
    var el = h.el;
    var state = { level: "Easy", tempo: 88, card: [], playing: false, timers: [] };

    container.appendChild(h.pageHead("🥁", "Rhythm Flashcards",
      "Read the rhythm, then clap it back after the app claps it for you."));

    // Level + tempo
    var levelGroup = el("div.pill-group");
    Object.keys(LEVELS).forEach(function (lv) {
      var p = el("button.pill", { text: lv, onclick: function () {
        state.level = lv; syncPills(levelGroup, lv); deal();
      }});
      if (lv === state.level) p.classList.add("is-active");
      p.dataset.label = lv;
      levelGroup.appendChild(p);
    });
    var tempoVal = el("b", { text: state.tempo + "" });
    var tempo = el("input", { type: "range", min: "20", max: "500", value: state.tempo + "", "aria-label": "Tempo",
      oninput: function () { state.tempo = +tempo.value; tempoVal.textContent = tempo.value; } });
    container.appendChild(el("div.card", null,
      el("div.control-row", null, el("span.hint", { text: "Level:" }), levelGroup),
      el("div.spacer-sm"),
      el("div.control-row", null, el("label.slider", null, el("span", { text: "🐢 Tempo " }), tempo,
        el("span", null, tempoVal, el("span", { text: " BPM 🐇" }))))
    ));

    // The card
    var beatsRow = el("div.rhythm-beats");
    container.appendChild(el("div.card.rhythm-card", null, beatsRow));

    // Controls
    var clapBtn = el("button.btn.btn--play", { html: "👏 Clap it for me", onclick: playCard });
    var newBtn = el("button.btn.btn--blue", { html: "🃏 New card", onclick: deal });
    container.appendChild(el("div.control-row", { style: "justify-content:center" }, clapBtn, newBtn));

    container.appendChild(el("div.card", null,
      el("p.hint", { text: "How to use it: deal a card, tap \"Clap it for me,\" listen through the count-in (4 clicks), then have students echo-clap the pattern back. Say the syllables together first!" })
    ));

    deal();

    // ---------------------------------------------------------------------
    function deal() {
      stop();
      var pool = LEVELS[state.level];
      state.card = [];
      for (var i = 0; i < 4; i++) {
        var pick = pool[Math.floor(Math.random() * pool.length)];
        state.card.push(pick);
      }
      // Avoid an all-rest card.
      if (state.card.every(function (v) { return v === "rest"; })) state.card[0] = "quarter";
      draw();
    }

    function draw() {
      beatsRow.innerHTML = "";
      state.card.forEach(function (id, i) {
        var v = VALUES[id];
        var cell = el("div.rbeat", null,
          el("div.glyph", { html: v.icon }),
          el("div.syl", { text: v.syl })
        );
        cell.dataset.i = i;
        beatsRow.appendChild(cell);
      });
    }

    function flash(i) {
      var cell = beatsRow.querySelector('.rbeat[data-i="' + i + '"]');
      if (!cell) return;
      cell.classList.add("hit");
      setTimeout(function () { cell.classList.remove("hit"); }, 220);
    }

    function playCard() {
      Sound.unlock();
      stop();
      state.playing = true;
      var beatSec = 60 / state.tempo;
      var t0 = Sound.now() + 0.1;

      // Count-in: 4 soft clicks (accent on 1).
      for (var c = 0; c < 4; c++) Sound.click(c === 0, t0 + c * beatSec);

      // The pattern starts after the count-in.
      var start = t0 + 4 * beatSec;
      state.card.forEach(function (id, i) {
        var v = VALUES[id];
        v.hits.forEach(function (f) {
          Sound.click(f === 0 && i === 0, start + (i + f) * beatSec);
        });
        // schedule the visual flash (real timer, relative to now)
        var ms = ((start + i * beatSec) - Sound.now()) * 1000;
        state.timers.push(setTimeout(function () { flash(i); }, Math.max(0, ms)));
      });
      // reset playing flag after it finishes
      state.timers.push(setTimeout(function () { state.playing = false; }, ((start + 4 * beatSec) - Sound.now()) * 1000));
    }

    function stop() {
      state.playing = false;
      state.timers.forEach(clearTimeout);
      state.timers = [];
    }

    function syncPills(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }

    return stop;
  }

  App.register({
    id: "rhythmcards",
    title: "Rhythm Flashcards",
    emoji: "🥁",
    desc: "Echo-clap 4-beat rhythm cards at three levels.",
    color: "tile--lime",
    render: render
  });
})();

/* ==========================================================================
   ukulele.js — beginner ukulele chord chart.
   Shows 8 common chords as diagrams (standard GCEA re-entrant tuning) with
   finger numbers, plus a "Strum" button that plays the chord so kids can
   check their ears against their fingers.

    // String labels
    STRINGS.forEach(function (s, i) {
      var x = x0 + (i / 3) * (x1 - x0);
      svg.appendChild(svgEl("text", { x: x, y: 16, "text-anchor": "middle", "font-size": 15,
        "font-family": "'Baloo 2', sans-serif", "font-weight": "800", fill: "#5a4f73" })).textContent = s;
    });

    // Nut (thick top line) + 4 frets
    svg.appendChild(svgEl("line", { x1: x0, y1: y0, x2: x1, y2: y0, stroke: "#2b2140", "stroke-width": 5 }));
    for (var f = 1; f <= MAX_FRET; f++) {
      var y = y0 + f * fretH;

    }

      var x = x0 + (i / 3) * (x1 - x0);

  }

  function render(container, h) {

  <script>
// ---- js/terms.js ----
/* ==========================================================================
   terms.js — Musical Terms glossary (Dynamics, Tempo, Expression).
   Every term has a "demo" so kids hear the idea, not just read a definition:
   dynamics change volume, tempo terms play a click loop at that speed, and
   expression terms shape a short phrase (smooth, detached, accented, held).
   ========================================================================== */

(function () {
  function render(container, h) {
    var el = h.el;
    var state = { cat: "All" };

    container.appendChild(h.pageHead("🔤", "Musical Terms",
      "Tap a card to read it, then tap 🔊 to hear what it means."));

    var catRow = el("div.filter-row");
    ["All"].concat(DATA.termCategories).forEach(function (c) {
      var p = el("button.pill", { text: c, onclick: function () { state.cat = c; syncPills(catRow, c); draw(); } });
      if (c === "All") p.classList.add("is-active");
      p.dataset.label = c;
      catRow.appendChild(p);
    });
    container.appendChild(catRow);

    var grid = el("div.term-grid");
    container.appendChild(grid);

    draw();

    function draw() {
      grid.innerHTML = "";
      DATA.terms.filter(function (t) { return state.cat === "All" || t.category === state.cat; })
        .forEach(function (t) {
          var card = el("div.term-card");
          card.appendChild(el("div.term-cat-tag", { text: t.category }));
          card.appendChild(el("h3", { html: t.term + (t.abbr ? " <span class='term-abbr'>" + t.abbr + "</span>" : "") }));
          card.appendChild(el("p", { text: t.meaning }));
          var demoBtn = el("button.btn.btn--purple", { html: "🔊 Hear it", style: "font-size:15px;padding:10px 20px;min-height:auto;",
            onclick: function () { playDemo(t.demo, demoBtn); } });
          card.appendChild(demoBtn);
          grid.appendChild(card);
        });
    }

    function syncPills(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }
  }

  // ---- Demo player: interprets a term's "demo" descriptor into sound -------
  function playDemo(demo, btn) {
    Sound.unlock();
    if (btn) { btn.disabled = true; setTimeout(function () { btn.disabled = false; }, 1800); }

    if (demo.type === "volume") {
      Sound.tone(Sound.noteFreq("G4"), null, 0.9, "sine", demo.peak);
      return;
    }
    if (demo.type === "cresc" || demo.type === "decresc") {
      var notes = ["C4", "D4", "E4", "F4", "G4"];
      var peaks = [0.05, 0.15, 0.26, 0.38, 0.52];
      if (demo.type === "decresc") peaks = peaks.slice().reverse();
      var t = Sound.now() + 0.05;
      notes.forEach(function (n, i) {
        Sound.tone(Sound.noteFreq(n), t + i * 0.32, 0.34, "sine", peaks[i]);
      });
      return;
    }
    if (demo.type === "tempo") {
      var beatSec = 60 / demo.bpm;
      var t0 = Sound.now() + 0.05;
      for (var b = 0; b < 4; b++) Sound.click(b === 0, t0 + b * beatSec);
      return;
    }
    if (demo.type === "rit" || demo.type === "accel") {
      var interval = demo.type === "rit" ? 0.32 : 0.62;
      var factor = demo.type === "rit" ? 1.28 : 0.72;
      var when = Sound.now() + 0.05;
      for (var i = 0; i < 5; i++) {
        Sound.click(i === 0, when);
        when += interval;
        interval *= factor;
      }
      return;
    }
    if (demo.type === "legato") {
      var mel = ["C4", "D4", "E4", "F4"];
      var step = 0.34;
      var tl = Sound.now() + 0.05;
      mel.forEach(function (n, i) { Sound.tone(Sound.noteFreq(n), tl + i * step, step * 1.35, "sine", 0.26); });
      return;
    }
    if (demo.type === "staccato") {
      var mel2 = ["C4", "D4", "E4", "F4"];
      var step2 = 0.34;
      var ts = Sound.now() + 0.05;
      mel2.forEach(function (n, i) { Sound.tone(Sound.noteFreq(n), ts + i * step2, 0.09, "triangle", 0.3); });
      return;
    }
    if (demo.type === "accent") {
      var mel3 = ["C4", "C4", "C4", "C4"];
      var peaks3 = [0.16, 0.16, 0.5, 0.16];
      var step3 = 0.3;
      var ta = Sound.now() + 0.05;
      mel3.forEach(function (n, i) { Sound.tone(Sound.noteFreq(n), ta + i * step3, 0.22, "triangle", peaks3[i]); });
      return;
    }
    if (demo.type === "fermata") {
      var tf = Sound.now() + 0.05;
      Sound.tone(Sound.noteFreq("C4"), tf, 0.28, "sine", 0.28);
      Sound.tone(Sound.noteFreq("D4"), tf + 0.36, 0.28, "sine", 0.28);
      Sound.tone(Sound.noteFreq("E4"), tf + 0.72, 1.7, "sine", 0.32); // held long — the fermata
      return;
    }
  }

  App.register({
    id: "terms",
    title: "Musical Terms",
    emoji: "🔤",
    desc: "Dynamics, tempo & expression — read it, then hear it.",
    color: "tile--grape",
    render: render
  });
})();

</script>

(function () {
  var SECTION_COLOR = { "Strings": "#5b8cff", "Woodwinds": "#7ed957", "Brass": "#ffab3d", "Percussion": "#ff5da2" };
  var SECTION_ICON_KEY = { "Strings": "Violin", "Woodwinds": "Flute", "Brass": "Trumpet", "Percussion": "Xylophone" };

  // Instruments with a real Philharmonia Orchestra recording under audio/instruments/.
  var SAMPLE_FILE = {
    "Violin": "violin", "Viola": "viola", "Cello": "cello", "Double Bass": "double-bass",
    "Flute": "flute", "Clarinet": "clarinet", "Oboe": "oboe", "Bassoon": "bassoon", "Saxophone": "saxophone",

  <script>
// ---- js/songmaker.js ----
/* ==========================================================================
   songmaker.js — a tap-the-grid melody sequencer (Chrome Music Lab style).
   Rows are pitches (colored like Boomwhackers), columns are steps. Tap cells
   to place notes, press Play and a playhead sweeps across, looping. Defaults
   to a pentatonic scale so there are no "wrong" notes — everything a kid taps
   sounds good together.
   ========================================================================== */

(function () {
  var SCALES = {
    "Pentatonic": ["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5", "A5"],
    "Major":      ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"]
  };
  var VOICES = {
    "Bells":   { type: "sine",     peak: 0.32 },
    "Marimba": { type: "triangle", peak: 0.30 },
    "Organ":   { type: "square",   peak: 0.18 }
  };
  var COLS = 16;

  function letter(note) { return note.charAt(0); }

  function render(container, h) {
    var el = h.el;
    var state = { scale: "Pentatonic", voice: "Bells", tempo: 120,
                  rows: SCALES["Pentatonic"], grid: null, playing: false, pos: 0, timer: null };

    function blankGrid() {
      var g = [];
      for (var r = 0; r < state.rows.length; r++) { g.push(new Array(COLS).fill(false)); }
      return g;
    }
    state.grid = blankGrid();

    container.appendChild(h.pageHead("🎶", "Song Maker",
      "Tap the squares to make a tune, then press Play. It loops!"));

    // ---- Controls --------------------------------------------------------
    var scaleGroup = pillGroup(Object.keys(SCALES), state.scale, function (v) {
      state.scale = v; state.rows = SCALES[v]; state.grid = blankGrid(); stop(); drawGrid();
    });
    var voiceGroup = pillGroup(Object.keys(VOICES), state.voice, function (v) { state.voice = v; });

    var tempoVal = el("b", { text: state.tempo + "" });
    var tempo = el("input", { type: "range", min: "20", max: "500", value: state.tempo + "", "aria-label": "Tempo",
      oninput: function () { state.tempo = +tempo.value; tempoVal.textContent = tempo.value; } });

    container.appendChild(el("div.card", null,
      el("div.control-row", null, el("span.hint", { text: "Notes:" }), scaleGroup,
        el("span.hint", { text: "Sound:" }), voiceGroup),
      el("div.spacer-sm"),
      el("div.control-row", null, el("label.slider", null, el("span", { text: "🐢 Tempo " }), tempo,
        el("span", null, tempoVal, el("span", { text: " BPM 🐇" }))))
    ));

    // ---- Grid ------------------------------------------------------------
    var gridWrap = el("div.sm-gridwrap");
    var gridEl = el("div.sm-grid");
    gridWrap.appendChild(gridEl);
    container.appendChild(el("div.card", null, gridWrap));

    // ---- Play / Clear ----------------------------------------------------
    var playBtn = el("button.btn.btn--play", { html: "▶︎ Play", onclick: toggle });
    var clearBtn = el("button.btn.btn--stop", { html: "🧽 Clear", onclick: function () {
      state.grid = blankGrid(); stop(); drawGrid();
    }});
    container.appendChild(el("div.control-row", { style: "justify-content:center" }, playBtn, clearBtn));

    // ---- Save My Song (Magic Link) --------------------------------------
    container.appendChild(el("div.card", null,
      App.shareControl({ label: "🔗 Save My Song", hashId: "songmaker", key: "song", thing: "song", getValue: encodeState })
    ));

    container.appendChild(el("div.card", null,
      el("p.hint", { text: "Tip: try tapping a few squares in a staircase going up — then press Play and listen to your melody climb!" })
    ));

    drawGrid();
    loadFromLink();

    // ---------------------------------------------------------------------
    // Rows are drawn top (highest pitch) to bottom (lowest), like a staff.
    function drawGrid() {
      gridEl.innerHTML = "";
      for (var r = state.rows.length - 1; r >= 0; r--) {
        (function (r) {
          var note = state.rows[r];
          var color = DATA.noteColors[letter(note)] || "#ccc";
          var row = el("div.sm-row");
          row.appendChild(el("span.sm-rowlabel", { text: letter(note), style: "color:" + color }));
          for (var c = 0; c < COLS; c++) {
            (function (c) {
              var cell = el("div.sm-cell");
              if (c % 4 === 0 && c > 0) cell.classList.add("beatstart");
              if (state.grid[r][c]) { cell.classList.add("on"); cell.style.setProperty("--cc", color); }
              cell.dataset.r = r; cell.dataset.c = c;
              cell.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                Sound.unlock();
                state.grid[r][c] = !state.grid[r][c];
                if (state.grid[r][c]) {
                  cell.classList.add("on"); cell.style.setProperty("--cc", color);
                  voicePlay(note);
                } else {
                  cell.classList.remove("on");
                }
              });
              row.appendChild(cell);
            })(c);
          }
          gridEl.appendChild(row);
        })(r);
      }
    }

    function voicePlay(note, when) {
      var v = VOICES[state.voice];
      var stepSec = 30 / state.tempo;
      Sound.tone(Sound.noteFreq(note), when || null, Math.max(0.18, stepSec * 1.6), v.type, v.peak);
    }

    // ---- Playback --------------------------------------------------------
    function toggle() { state.playing ? stop() : play(); }

    function play() {
      Sound.unlock();
      state.playing = true; state.pos = 0;
      playBtn.innerHTML = "⏸ Stop";
      playBtn.classList.remove("btn--play"); playBtn.classList.add("btn--stop");
      step();
    }

    function step() {
      if (!state.playing) return;
      var c = state.pos % COLS;
      highlightColumn(c);
      for (var r = 0; r < state.rows.length; r++) {
        if (state.grid[r][c]) voicePlay(state.rows[r], Sound.now() + 0.01);
      }
      state.pos++;
      state.timer = setTimeout(step, (30 / state.tempo) * 1000);
    }

    function highlightColumn(c) {
      var cells = gridEl.querySelectorAll(".sm-cell");
      Array.prototype.forEach.call(cells, function (cell) {
        cell.classList.toggle("col-playing", +cell.dataset.c === c);
      });
    }

    function stop() {
      state.playing = false;
      if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      playBtn.innerHTML = "▶︎ Play";
      playBtn.classList.add("btn--play"); playBtn.classList.remove("btn--stop");
      var cells = gridEl.querySelectorAll(".col-playing");
      Array.prototype.forEach.call(cells, function (cell) { cell.classList.remove("col-playing"); });
    }

    // ---- Magic Link encode / decode -------------------------------------
    // Format: "<scale><voiceIdx>-<tempo>-<gridHex>", e.g. "P0-120-a1b2…"
    function encodeState() {
      var scaleCode = state.scale === "Pentatonic" ? "P" : "M";
      var voiceIdx = Object.keys(VOICES).indexOf(state.voice);
      var bits = "";
      for (var r = 0; r < state.rows.length; r++) {
        for (var c = 0; c < COLS; c++) bits += state.grid[r][c] ? "1" : "0";
      }
      return scaleCode + voiceIdx + "-" + state.tempo + "-" + App.bitsToHex(bits);
    }

    function loadFromLink() {
      var code = App.consumeParam("song");
      if (!code) return;
      var parts = code.split("-");
      if (parts.length < 3) return;
      var scaleCode = parts[0].charAt(0);
      var voiceIdx = parseInt(parts[0].charAt(1), 10) || 0;
      state.scale = scaleCode === "M" ? "Major" : "Pentatonic";
      state.rows = SCALES[state.scale];
      state.tempo = Math.min(500, Math.max(20, parseInt(parts[1], 10) || 120));
      state.voice = Object.keys(VOICES)[voiceIdx] || "Bells";
      state.grid = blankGrid();
      var bits = App.hexToBits(parts[2], state.rows.length * COLS);
      var i = 0;
      for (var r = 0; r < state.rows.length; r++) {
        for (var c = 0; c < COLS; c++) state.grid[r][c] = bits.charAt(i++) === "1";
      }
      // Refresh the controls to match the loaded creation.
      tempo.value = state.tempo; tempoVal.textContent = state.tempo;
      syncPills(scaleGroup, state.scale);
      syncPills(voiceGroup, state.voice);
      drawGrid();
    }

    function pillGroup(labels, active, onpick) {
      var group = el("div.pill-group");
      labels.forEach(function (lb) {
        var p = el("button.pill", { text: lb, onclick: function () { syncPills(group, lb); onpick(lb); } });
        if (lb === active) p.classList.add("is-active");
        p.dataset.label = lb;
        group.appendChild(p);
      });
      return group;
    }
    function syncPills(row, label) {
      Array.prototype.forEach.call(row.children, function (b) {
        b.classList.toggle("is-active", b.dataset.label === label);
      });
    }

    return stop;
  }

  App.register({
    id: "songmaker",
    title: "Song Maker",
    emoji: "🎶",
    desc: "Tap a grid to make a melody — pentatonic, so it always sounds good.",
    color: "tile--rainbow",
    render: render
  });
})();

// ---- js/beatmaker.js ----
/* ==========================================================================
   beatmaker.js — a drum-machine step sequencer with animated characters.
   Each row is a percussion sound with a little cartoon "player" that bounces
   and hits in time whenever its step fires — inspired by Chrome Music Lab's
   Rhythm experiment. Tap the steps to build a beat, press Play, and watch the
   band play along.
   ========================================================================== */

(function () {
  var STEPS = 16;

  // Each drummer: a character emoji, a color, and how to make its sound.
  var KIT = [
    { name: "Hi-Hat", emoji: "🐱", color: "#2dd4bf", play: function (t) { Sound.noise(t, 0.05, 0.28, "hat"); } },
    { name: "Clap",   emoji: "🐸", color: "#7ed957", play: function (t) { Sound.noise(t, 0.09, 0.4, "clap"); Sound.noise(t + 0.02, 0.06, 0.3, "clap"); } },
    { name: "Snare",  emoji: "🐰", color: "#ff5da2", play: function (t) { Sound.noise(t, 0.16, 0.4, "snare"); Sound.perc(190, t, 0.10, "triangle"); } },
    { name: "Kick",   emoji: "🐵", color: "#5b8cff", play: function (t) { Sound.perc(72, t, 0.22, "sine"); Sound.perc(48, t, 0.28, "sine"); } }
  ];

  function render(container, h) {
    var el = h.el;
    var state = { tempo: 100, grid: KIT.map(function () { return new Array(STEPS).fill(false); }),
                  playing: false, pos: 0, timer: null };

    container.appendChild(h.pageHead("🥁", "Beat Maker",
      "Tap the squares to build a beat — the band plays along when you press Play!"));

    var tempoVal = el("b", { text: state.tempo + "" });
    var tempo = el("input", { type: "range", min: "20", max: "500", value: state.tempo + "", "aria-label": "Tempo",
      oninput: function () { state.tempo = +tempo.value; tempoVal.textContent = tempo.value; } });
    container.appendChild(el("div.card", null,
      el("div.control-row", null, el("label.slider", null, el("span", { text: "🐢 Tempo " }), tempo,
        el("span", null, tempoVal, el("span", { text: " BPM 🐇" }))))
    ));

    // ---- The rows of drummers + steps -----------------------------------
    var board = el("div.bm-board");
    KIT.forEach(function (inst, r) {
      var row = el("div.bm-row");
      var char = el("div.bm-char", { style: "--ic:" + inst.color },
        el("span.bm-char-emoji", { text: inst.emoji }),
        el("span.bm-char-name", { text: inst.name })
      );
      char.dataset.r = r;
      row.appendChild(char);

      var steps = el("div.bm-steps");
      for (var c = 0; c < STEPS; c++) {
        (function (c) {
          var cell = el("div.bm-step");
          if (c % 4 === 0 && c > 0) cell.classList.add("beatstart");
          cell.dataset.r = r; cell.dataset.c = c;
          cell.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            Sound.unlock();
            state.grid[r][c] = !state.grid[r][c];
            cell.classList.toggle("on", state.grid[r][c]);
            if (state.grid[r][c]) { cell.style.setProperty("--ic", inst.color); inst.play(Sound.now() + 0.01); hit(r); }
          });
          steps.appendChild(cell);
        })(c);
      }
      row.appendChild(steps);
      board.appendChild(row);
    });
    container.appendChild(el("div.card", null, board));

    // ---- Play / Clear ----------------------------------------------------
    var playBtn = el("button.btn.btn--play", { html: "▶︎ Play", onclick: toggle });
    var clearBtn = el("button.btn.btn--stop", { html: "🧽 Clear", onclick: function () {
      state.grid = KIT.map(function () { return new Array(STEPS).fill(false); });
      stop(); redrawCells();
    }});
    container.appendChild(el("div.control-row", { style: "justify-content:center" }, playBtn, clearBtn));

    // ---- Save My Beat (Magic Link) --------------------------------------
    container.appendChild(el("div.card", null,
      App.shareControl({ label: "🔗 Save My Beat", hashId: "beatmaker", key: "beat", thing: "beat", getValue: encodeState })
    ));

    container.appendChild(el("div.card", null,
      el("p.hint", { text: "Try this starter beat: tap Kick on squares 1 and 5, Snare on 5 and 13, and Hi-Hat on every other square. Press Play!" })
    ));

    loadFromLink();

    // ---------------------------------------------------------------------
    // ---- Magic Link encode / decode -------------------------------------
    // Format: "<tempo>-<gridHex>", e.g. "100-ffa1…"
    function encodeState() {
      var bits = "";
      for (var r = 0; r < KIT.length; r++) {
        for (var c = 0; c < STEPS; c++) bits += state.grid[r][c] ? "1" : "0";

    function loadFromLink() {

      if (!code) return;
      var parts = code.split("-");
      if (parts.length < 2) return;
      state.tempo = Math.min(500, Math.max(20, parseInt(parts[0], 10) || 100));
      var bits = App.hexToBits(parts[1], KIT.length * STEPS);
      var i = 0;
      state.grid = KIT.map(function () { return new Array(STEPS).fill(false); });
      for (var r = 0; r < KIT.length; r++) {

    }

    function toggle() { state.playing ? stop() : play(); }

    function play() {
      Sound.unlock();
      state.playing = true; state.pos = 0;
      playBtn.innerHTML = "⏸ Stop";
      playBtn.classList.remove("btn--play"); playBtn.classList.add("btn--stop");
      step();
    }

    function step() {
      if (!state.playing) return;

      });
      state.pos++;
      state.timer = setTimeout(step, (30 / state.tempo) * 1000);
    }

    function highlightColumn(c) {
      var cells = board.querySelectorAll(".bm-step");
      Array.prototype.forEach.call(cells, function (cell) {
        cell.classList.toggle("col-playing", +cell.dataset.c === c);
      });
    }

    function stop() {
      state.playing = false;
      if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      playBtn.innerHTML = "▶︎ Play";
      playBtn.classList.add("btn--play"); playBtn.classList.remove("btn--stop");
      var cells = board.querySelectorAll(".col-playing");
      Array.prototype.forEach.call(cells, function (cell) { cell.classList.remove("col-playing"); });
    }

    return stop;
  }

  App.register({
    id: "beatmaker",
    title: "Beat Maker",
    emoji: "🥁",
    desc: "Build a beat and watch a band of characters play it.",
    color: "tile--berry",
    render: render

})();

(function () {

      var bar = el("button.bell-bar", { style: "--bc:" + color + ";height:" + heightPct + "%",
        onclick: function () { Sound.unlock(); playBar(note); } },
        el("span.bell-label", { text: letter(note) })

      var p = el("button.pill", { text: song.name, onclick: function () { selectSong(song, p); } });
      p.dataset.label = song.name;
      songRow.appendChild(p);
    });

    var dotsRow = el("div.bell-dots");
    var playSongBtn = el("button.btn.btn--play", { html: "▶︎ Play it", style: "display:none", onclick: playSong });

    container.appendChild(el("div.card", null,
      el("div.hint", { text: "Follow the colors — pick a song:" }),
      songRow,
      el("div.spacer-sm"),
      dotsRow,
      el("div.control-row", { style: "justify-content:center" }, playSongBtn)
    ));

    container.appendChild(el("div.card", null,
      el("p.hint", { text: "Each colored dot is a bar to tap. Press \"Play it\" and the app will light the bars in time so you can play along." })
    ));

    // ---------------------------------------------------------------------
    function playBar(note, when) {
      Sound.tone(Sound.noteFreq(note), when || null, 0.7, "sine", 0.32);
      flash(note);
    }

    function flash(note) {
      var bar = bars[note];
      if (!bar) return;
      bar.classList.remove("ring");
      void bar.offsetWidth;
      bar.classList.add("ring");
      setTimeout(function () { bar.classList.remove("ring"); }, 240);
    }

    function selectSong(song, pill) {
      stopSong();
      state.song = song;
      Array.prototype.forEach.call(songRow.children, function (b) {
        b.classList.toggle("is-active", b === pill);
      });
      drawDots();
      playSongBtn.style.display = "";
    }

    function drawDots() {
      dotsRow.innerHTML = "";
      state.song.notes.forEach(function (n) {
        var note = n[0];
        var color = DATA.noteColors[letter(note)] || "#ccc";
        dotsRow.appendChild(el("span.bell-dot", { style: "background:" + color, text: letter(note) }));
      });
    }

    function playSong() {
      if (!state.song) return;
      Sound.unlock();
      stopSong();
      state.playing = true;
      playSongBtn.innerHTML = "🎶 Playing…";
      var beat = 60 / state.song.tempo;
      var t = Sound.now() + 0.15;
      var dots = dotsRow.querySelectorAll(".bell-dot");
      var elapsed = 0.15;
      state.song.notes.forEach(function (n, i) {
        var note = n[0], dur = n[1] * beat;
        playScheduled(note, t);
        // schedule the visual highlight on the wall clock
        (function (i) {
          state.timers.push(setTimeout(function () {
            flash(note);
            Array.prototype.forEach.call(dots, function (d, k) { d.classList.toggle("now", k === i); });
          }, elapsed * 1000));
        })(i);
        t += dur; elapsed += dur;
      });
      state.timers.push(setTimeout(function () {
        stopSong();
      }, elapsed * 1000 + 200));
    }

    function playScheduled(note, when) {
      Sound.tone(Sound.noteFreq(note), when, 0.7, "sine", 0.32);
    }

    function stopSong() {
      state.playing = false;
      state.timers.forEach(clearTimeout);
      state.timers = [];
      playSongBtn.innerHTML = "▶︎ Play it";
      if (dotsRow) {
        var dots = dotsRow.querySelectorAll(".bell-dot.now");
        Array.prototype.forEach.call(dots, function (d) { d.classList.remove("now"); });
      }
    }

    return stopSong;
  }

  App.register({
    id: "bells",
    title: "Bells",
    emoji: "🔔",
    desc: "A colored xylophone with a follow-the-colors play-along.",
    color: "tile--aqua",
    render: render
  });
})();

</script>
  <script>
    window.addEventListener('DOMContentLoaded', function () { App.start(); });
  </script>
</body>
